<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f7fa; color: #222; }
  header { background: linear-gradient(135deg,#C8102E,#7a0a1c); color: #fff; padding: 24px; border-radius: 12px; margin-bottom: 16px; }
  header h1 { margin: 0 0 6px 0; font-size: 22px; }
  header p { margin: 0; opacity: .92; font-size: 14px; }
  #stats { background: #fff; padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 10; }
  #stats div { font-size: 14px; }
  #stats b { color: #C8102E; font-size: 17px; }
  .controls { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button { background: #fff; border: 1px solid #ddd; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .controls button:hover { background: #fff0f2; border-color: #C8102E; }
  .controls .restart { background:#C8102E; color:#fff; border-color:#C8102E; font-weight:600; }
  .controls .restart:hover { background:#a00d24; }
  .toggle-cn { background:#1E2761; color:#fff; border-color:#1E2761; }
  .empty { background:#fff; border-radius:12px; padding:40px 24px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .empty h2 { color:#16a34a; margin:0 0 12px; }
  .empty a { color:#C8102E; font-weight:600; }
  .q { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .q .num { font-weight: 700; color: #C8102E; margin-bottom: 8px; font-size: 14px; }
  .multi-hint { display:inline-block; background:#fff0f2; color:#C8102E; padding:2px 8px; border-radius:4px; font-size:12px; margin-left:8px; }
  .stem { white-space: pre-wrap; line-height: 1.55; margin-bottom: 6px; font-size: 15px; }
  .stem-cn { white-space: pre-wrap; line-height:1.6; margin-bottom:12px; font-size:15px; color:#1E2761; font-weight:600; background:#fff6f0; border-left:3px solid #FA582D; padding:8px 12px; border-radius:6px; }
  .opt { display: block; padding: 10px 12px; margin: 6px 0; background: #fafafa; border: 1.5px solid #e8e8e8; border-radius: 8px; cursor: pointer; line-height: 1.45; font-size: 14px; }
  .opt:hover { background: #fff0f2; border-color: #C8102E; }
  .opt .cn { display:block; color:#555; font-size:13px; margin-top:2px; }
  .opt input { margin-right: 10px; }
  .opt.selected { border-color: #C8102E; background: #fff0f2; }
  .opt.correct { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .opt.reveal-correct { border-color: #16a34a; background: #f0fdf4; box-shadow: inset 0 0 0 1px #16a34a; }
  .submit { margin-top: 8px; background: #C8102E; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .submit:hover { background: #a00d24; }
  .feedback { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; }
  .feedback.ok { background: #f0fdf4; color: #16a34a; border-left: 4px solid #16a34a; }
  .feedback.ng { background: #fef2f2; color: #dc2626; border-left: 4px solid #dc2626; }
  .master-btn { margin-top:10px; margin-left:8px; background:#16a34a; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
  .master-btn:hover { background:#128a45; }
  .cn-hidden .stem-cn, .cn-hidden .opt .cn { display:none; }
</style>

<script>
const QUESTIONS = [
{n:1,multi:true,ans:["B","D"],topic:"Cloud NGFW 部署",stem:"To maintain security efficacy of its public cloud resources by using native tools, a company purchases Cloud NGFW credits to replicate the Panorama, PA-Series, and VM-Series devices used in physical data centers. Resources exist on AWS and Azure:\n- The AWS deployment is architected with AWS Transit Gateway, to which all resources connect\n- The Azure deployment is architected with each application independently routing traffic\n\nThe engineer deploying Cloud NGFW in these two cloud environments must account for:\n- Minimize changes to the two cloud environments\n- Scale to the demands of the applications while using the least amount of compute resources\n- Allow the company to unify the Security policies across all protected areas\n\nWhich two implementations will meet these requirements? (Choose two.)",opts:{"A":"Deploy a VM-Series firewall in AWS in each VPC, create an IPSec tunnel between AWS and Azure, and manage the policy with Panorama.","B":"Deploy Cloud NGFW for Azure in vNET/s, update the vNET/s routing to path traffic through the deployed NGFWs, and manage the policy with Panorama.","C":"Deploy Cloud NGFW for Azure in vWAN, create a vWAN to route all appropriate traffic to the Cloud NGFW attached to the vWAN, and manage the policy with local rules.","D":"Deploy Cloud NGFW for AWS in a centralized Security VPC, update the Transit Gateway to route all appropriate traffic through the Security VPC, and manage the policy with Panorama."},qZh:"某公司為了使用原生工具維護其公有雲資源的安全效能，購買了 Cloud NGFW 點數 (credits)，以複製其實體資料中心所使用的 Panorama、PA-Series 與 VM-Series 設備。資源同時存在於 AWS 與 Azure：\n- AWS 部署採用 AWS Transit Gateway 架構，所有資源皆連接至該 Transit Gateway\n- Azure 部署則為每個應用程式各自獨立地路由流量\n\n在這兩個雲端環境中部署 Cloud NGFW 的工程師必須考量以下事項：\n- 將兩個雲端環境的變動降到最低\n- 在使用最少運算資源的情況下，擴展以滿足應用程式的需求\n- 讓公司能夠在所有受保護區域之間統一安全政策 (Security policy)\n\n哪兩種實作方式能滿足這些需求？（選擇兩項。）",optsZh:{"A":"在 AWS 的每個 VPC 中部署 VM-Series 防火牆，在 AWS 與 Azure 之間建立 IPSec 隧道，並以 Panorama 管理政策。","B":"在 Azure 的 vNET 中部署 Cloud NGFW for Azure，更新 vNET 的路由以將流量導向所部署的 NGFW，並以 Panorama 管理政策。","C":"在 vWAN 中部署 Cloud NGFW for Azure，建立一個 vWAN 將所有適當的流量路由至附加於該 vWAN 的 Cloud NGFW，並以本地規則 (local rules) 管理政策。","D":"在集中式的 Security VPC 中部署 Cloud NGFW for AWS，更新 Transit Gateway 以將所有適當的流量路由經過該 Security VPC，並以 Panorama 管理政策。"}},
{n:2,ans:["B"],topic:"ARE 支援機型",stem:"During an upgrade to the routing infrastructure in a customer environment, the network administrator wants to implement Advanced Routing Engine (ARE) on a Palo Alto Networks firewall. Which firewall models support this configuration?",opts:{"A":"PA-5280, PA-7080, PA-3250, VM-Series","B":"PA-455, VM-Series, PA-1410, PA-5450","C":"PA-3260, PA-5410, PA-850, PA-460","D":"PA-7050, PA-1420, VM-Series, CN-Series"},qZh:"在升級某客戶環境的路由基礎架構期間，網路管理員希望在 Palo Alto Networks 防火牆上實作進階路由引擎 (Advanced Routing Engine, ARE)。哪些防火牆型號支援此設定？",optsZh:{"A":"PA-5280、PA-7080、PA-3250、VM-Series","B":"PA-455、VM-Series、PA-1410、PA-5450","C":"PA-3260、PA-5410、PA-850、PA-460","D":"PA-7050、PA-1420、VM-Series、CN-Series"}},
{n:3,multi:true,ans:["A","B"],topic:"IPSec Security Rule",stem:"Which two statements apply to configuring required security rules when setting up an IPSec tunnel between a Palo Alto Networks firewall and a third-party gateway? (Choose two.)",opts:{"A":"For incoming and outgoing traffic through the tunnel, creating separate rules for each direction is optional.","B":"The IKE negotiation and IPSec/ESP packets are allowed by default via the intrazone default allow policy.","C":"For incoming and outgoing traffic through the tunnel, separate rules must be created for each direction.","D":"The IKE negotiation and IPSec/ESP packets are denied by default via the interzone default deny policy."},qZh:"在 Palo Alto Networks 防火牆與第三方閘道之間建立 IPSec 隧道時，關於設定所需的安全規則 (security rules)，下列哪兩項陳述適用？（選擇兩項。）",optsZh:{"A":"對於通過隧道的傳入與傳出流量，為每個方向各自建立獨立規則是選用的 (optional)。","B":"IKE 協商與 IPSec/ESP 封包預設透過區域內預設允許政策 (intrazone default allow policy) 被允許通過。","C":"對於通過隧道的傳入與傳出流量，必須為每個方向各自建立獨立規則。","D":"IKE 協商與 IPSec/ESP 封包預設透過跨區域預設拒絕政策 (interzone default deny policy) 被拒絕。"}},
{n:4,ans:["C"],topic:"Terraform 角色",stem:"Which statement describes the role of Terraform in deploying Palo Alto Networks NGFWs?",opts:{"A":"It acts as a logging service for NGFW performance metrics.","B":"It orchestrates real-time traffic inspection for network segments.","C":"It provides Infrastructure-as-Code (IaC) to automate NGFW deployment.","D":"It manages threat intelligence data synchronization with NGFWs."},qZh:"哪一項陳述描述了 Terraform 在部署 Palo Alto Networks NGFW 時所扮演的角色？",optsZh:{"A":"它充當 NGFW 效能指標的日誌記錄服務。","B":"它為網路區段協調即時的流量檢測。","C":"它提供基礎架構即程式碼 (Infrastructure-as-Code, IaC) 以自動化 NGFW 部署。","D":"它管理威脅情資資料與 NGFW 之間的同步。"}},
{n:5,ans:["D"],topic:"Service Route 預設",stem:"By default, which type of traffic is configured by service route configuration to use the management interface?",opts:{"A":"Security zone","B":"IPSec tunnel","C":"Virtual system (VSYS)","D":"Autonomous Digital Experience Manager (ADEM)"},qZh:"預設情況下，service route 設定會將哪種類型的流量設定為使用管理介面 (management interface)？",optsZh:{"A":"Security zone（安全區域）","B":"IPSec 隧道","C":"Virtual system (VSYS)（虛擬系統）","D":"Autonomous Digital Experience Manager (ADEM)"}},
{n:6,ans:["D"],topic:"Q6",stem:"In regard to the Advanced Routing Engine (ARE), what must be enabled first when configuring a logical router on a PAN-OS firewall?",opts:{"A":"License","B":"Plugin","C":"Content update","D":"General setting"},qZh:"關於進階路由引擎 (Advanced Routing Engine, ARE)，在 PAN-OS 防火牆上設定邏輯路由器 (logical router) 時，必須先啟用什麼？",optsZh:{"A":"License（授權）","B":"Plugin（外掛程式）","C":"Content update（內容更新）","D":"General setting（一般設定）"}},
{n:7,multi:true,ans:["A","D"],topic:"Zone 類型",stem:"Which two zone types are valid when configuring a new security zone? (Choose two.)",opts:{"A":"Tunnel","B":"Intrazone","C":"Internal","D":"Virtual Wire"},qZh:"在設定新的 security zone（安全區域）時，哪兩種 zone 類型是有效的？（選擇兩項。）",optsZh:{"A":"Tunnel（隧道）","B":"Intrazone（區域內）","C":"Internal（內部）","D":"Virtual Wire（虛擬線路）"}},
{n:8,ans:["A"],topic:"GP 混合認證",stem:"An organization has configured GlobalProtect in a hybrid authentication model using both certificate-based authentication for the pre-logon stage and SAML-based multi-factor authentication (MFA) for user logon. How does the GlobalProtect agent process the authentication flow on Windows endpoints?",opts:{"A":"The GlobalProtect agent uses the machine certificate to establish a pre-logon tunnel; upon user sign-in, it prompts for SAML-based MFA credentials, ensuring both device and user identities are validated before granting full access.","B":"The GlobalProtect agent uses the machine certificate during pre-logon for initial tunnel establishment, and then seamlessly reuses the same machine certificate for user-based authentication without requiring MFA.","C":"Once the machine certificate is validated at pre-logon, the Windows endpoint completes MFA on behalf of the user by passing existing Windows Credential Provider details to the GlobalProtect gateway without prompting the user.","D":"GlobalProtect requires the user to log in first for SAML-based MFA before establishing the pre-logon tunnel, rendering the pre-logon certificate authentication (CA) flow redundant."},qZh:"某組織以混合認證模式設定了 GlobalProtect，在 pre-logon（登入前）階段使用憑證式認證 (certificate-based authentication)，而在使用者登入時使用基於 SAML 的多重要素驗證 (multi-factor authentication, MFA)。GlobalProtect 代理程式在 Windows 端點上如何處理此認證流程？",optsZh:{"A":"GlobalProtect 代理程式使用機器憑證 (machine certificate) 建立 pre-logon 隧道；當使用者登入時，會提示輸入基於 SAML 的 MFA 憑證，確保在授予完整存取權限之前，裝置與使用者的身份都已被驗證。","B":"GlobalProtect 代理程式在 pre-logon 期間使用機器憑證進行初始隧道建立，接著無縫地重複使用相同的機器憑證進行使用者層級的認證，而不需要 MFA。","C":"一旦機器憑證在 pre-logon 階段通過驗證，Windows 端點便會代表使用者完成 MFA，將既有的 Windows Credential Provider 詳細資訊傳遞給 GlobalProtect 閘道，而不提示使用者。","D":"GlobalProtect 要求使用者必須先完成基於 SAML 的 MFA 登入，才能建立 pre-logon 隧道，使得 pre-logon 憑證認證 (CA) 流程變得多餘。"}},
{n:9,ans:["C"],topic:"Q9",stem:"An NGFW engineer is configuring multiple Panorama-managed firewalls to start sending all logs to Strata Logging Service. The Strata Logging Service instance has been provisioned, the required device certificates have been installed, and Panorama and the firewalls have been successfully onboarded to Strata Logging Service. Which configuration task must be performed to start sending the logs to Strata Logging Service and continue forwarding them to the Panorama log collectors as well?",opts:{"A":"Modify all active Log Forwarding profiles to select the \"Cloud Logging\" option in each profile match list in the appropriate device groups.","B":"Enable the \"Panorama/Cloud Logging\" option in the Logging and Reporting Settings section under Device → Setup → Management in the appropriate templates.","C":"Select the \"Enable Duplicate Logging\" option in the Cloud Logging section under Device → Setup → Management in the appropriate templates.","D":"Select the \"Enable Cloud Logging\" option in the Cloud Logging section under Device → Setup → Management in the appropriate templates."},qZh:"某 NGFW 工程師正在設定多台由 Panorama 管理的防火牆，使其開始將所有日誌傳送至 Strata Logging Service。Strata Logging Service 執行個體已佈建完成，所需的裝置憑證已安裝，且 Panorama 與防火牆均已成功上線 (onboarded) 至 Strata Logging Service。必須執行哪一項設定任務，才能開始將日誌傳送至 Strata Logging Service，同時繼續將其轉發至 Panorama 的 log collectors？",optsZh:{"A":"修改所有作用中的 Log Forwarding profile，在適當裝置群組 (device groups) 中每個 profile 的 match list 內選取「Cloud Logging」選項。","B":"在適當的 templates 中，於 Device → Setup → Management 下的 Logging and Reporting Settings 區段啟用「Panorama/Cloud Logging」選項。","C":"在適當的 templates 中，於 Device → Setup → Management 下的 Cloud Logging 區段選取「Enable Duplicate Logging」選項。","D":"在適當的 templates 中，於 Device → Setup → Management 下的 Cloud Logging 區段選取「Enable Cloud Logging」選項。"}},
{n:10,ans:["C"],topic:"L2 介面通訊",stem:"An NGFW engineer is configuring multiple Layer 2 interfaces on a Palo Alto Networks firewall, and all interfaces must be assigned to the same VLAN. During initial testing, it is reported that clients located behind the various interfaces cannot communicate with each other. Which action taken by the engineer will resolve this issue?",opts:{"A":"Configure each interface to belong to the same Layer 2 zone and enable IP routing between them.","B":"Assign each interface to the appropriate Layer 2 zone and configure a policy that allows traffic within the VLAN.","C":"Assign each interface to the appropriate Layer 2 zone and configure Security policies for interfaces not assigned to the same zone.","D":"Enable IP routing between the interfaces and configure a Security policy to allow traffic between interfaces within the VLAN."},qZh:"某 NGFW 工程師正在 Palo Alto Networks 防火牆上設定多個 Layer 2 介面，且所有介面都必須指派至同一個 VLAN。在初期測試時，回報指出位於各個介面後方的用戶端彼此之間無法通訊。工程師採取哪一項動作可解決此問題？",optsZh:{"A":"將每個介面設定為屬於同一個 Layer 2 zone，並在它們之間啟用 IP 路由。","B":"將每個介面指派至適當的 Layer 2 zone，並設定一條允許 VLAN 內流量的政策。","C":"將每個介面指派至適當的 Layer 2 zone，並為不屬於同一 zone 的介面設定安全政策 (Security policies)。","D":"在介面之間啟用 IP 路由，並設定一條安全政策以允許 VLAN 內介面之間的流量。"}},
{n:11,ans:["B"],topic:"Certificate Profile 功能",stem:"In a Palo Alto Networks environment, GlobalProtect has been enabled using certificate-based authentication for both users and devices. To ensure proper validation of certificates, one or more certificate profiles are configured. What function do certificate profiles serve in this context?",opts:{"A":"They store private keys for users and devices, effectively allowing the firewall to issue or reissue certificates if the primary Certificate Authority (CA) becomes unavailable, providing a built-in fallback CA to maintain continuous certificate issuance and authentication.","B":"They define trust anchors (root / intermediate Certificate Authorities (CAs)), specify revocation checks (CRL/OCSP), and map certificate attributes (e.g., CN) for user or device authentication.","C":"They allow the firewall to bypass certificate validation entirely, focusing only on username/password-based authentication.","D":"They provide a one-click mechanism to distribute certificates to all endpoints without relying on external enrollment methods."},qZh:"在某 Palo Alto Networks 環境中，已針對使用者與裝置兩者啟用以憑證式認證 (certificate-based authentication) 運作的 GlobalProtect。為了確保憑證的正確驗證，已設定一個或多個 certificate profiles。在此情境下，certificate profiles 發揮什麼功能？",optsZh:{"A":"它們為使用者與裝置儲存私鑰，實際上讓防火牆能夠在主要憑證授權單位 (Certificate Authority, CA) 無法使用時簽發或重新簽發憑證，提供一個內建的備援 CA 以維持持續的憑證簽發與認證。","B":"它們定義信任錨點 (trust anchors)（根/中繼憑證授權單位 (root / intermediate CAs)）、指定撤銷檢查 (revocation checks)（CRL/OCSP），並對應憑證屬性（例如 CN）以進行使用者或裝置認證。","C":"它們讓防火牆完全略過憑證驗證，僅專注於以使用者名稱／密碼為基礎的認證。","D":"它們提供一鍵式機制，將憑證散布至所有端點，而無需仰賴外部的註冊 (enrollment) 方法。"}},
{n:12,ans:["D"],topic:"Preemptive Hold Time = 0",stem:"How does a Palo Alto Networks NGFW respond when the preemptive hold time is set to 0 minutes during configuration of route monitoring?",opts:{"A":"It does not accept the configuration.","B":"It accepts the configuration but throws a warning message.","C":"It removes the static route because 0 is a NULL value.","D":"It reinstalls the route into the routing information base (RIB) as soon as the path comes up."},qZh:"當在設定路由監控 (route monitoring) 時將先佔保留時間 (preemptive hold time) 設為 0 分鐘，Palo Alto Networks NGFW 會如何回應？",optsZh:{"A":"它不接受此設定。","B":"它接受此設定，但會擲出一則警告訊息。","C":"它會移除該靜態路由，因為 0 是一個 NULL 值。","D":"它會在路徑恢復 (come up) 時立即將該路由重新安裝至路由資訊庫 (routing information base, RIB) 中。"}},
{n:13,ans:["B"],topic:"Cisco ASA IPSec",stem:"After an engineer configures an IPSec tunnel with a Cisco ASA, the Palo Alto Networks firewall generates system messages reporting the tunnel is failing to establish. Which of the following actions will resolve this issue?",opts:{"A":"Ensure that an active static or dynamic route exists for the VPN peer with next hop as the tunnel interface.","B":"Configure the Proxy IDs to match the Cisco ASA configuration.","C":"Check that IPSec is enabled in the management profile on the external interface.","D":"Validate the tunnel interface VLAN against the peer's configuration."},qZh:"某工程師設定了一條與 Cisco ASA 的 IPSec 隧道後，Palo Alto Networks 防火牆產生系統訊息，回報該隧道無法建立。下列哪一項動作可解決此問題？",optsZh:{"A":"確保存在一條指向 VPN 對等端 (peer)、下一跳 (next hop) 為隧道介面的作用中靜態或動態路由。","B":"設定 Proxy IDs 以對應 Cisco ASA 的設定。","C":"檢查外部介面的 management profile 中是否已啟用 IPSec。","D":"對照對等端的設定，驗證隧道介面的 VLAN。"}},
{n:14,ans:["C"],topic:"Q14",stem:"Which configuration in the LACP tab will enable pre-negotiation for an Aggregate Ethernet (AE) interface on a Palo Alto Networks high availability (HA) active/passive pair?",opts:{"A":"Set Transmission Rate to \"fast.\"","B":"Set passive link state to \"Auto.\"","C":"Set \"Enable in HA Passive State.\"","D":"Set LACP mode to \"Active.\""},qZh:"在 Palo Alto Networks 高可用性 (high availability, HA) active/passive 配對中，LACP 頁籤中的哪一項設定可為 Aggregate Ethernet (AE) 介面啟用預先協商 (pre-negotiation)？",optsZh:{"A":"將 Transmission Rate 設為「fast」。","B":"將被動鏈路狀態 (passive link state) 設為「Auto」。","C":"設定「Enable in HA Passive State」。","D":"將 LACP 模式設為「Active」。"}},
{n:15,ans:["D"],topic:"Kubernetes Microservices",stem:"When integrating Kubernetes with Palo Alto Networks NGFWs, what is used to secure traffic between microservices?",opts:{"A":"Service graph","B":"Ansible automation modules","C":"Panorama role-based access control (RBAC)","D":"CN-Series firewalls"},qZh:"在將 Kubernetes 與 Palo Alto Networks NGFW 整合時，使用什麼來保護微服務 (microservices) 之間的流量？",optsZh:{"A":"Service graph（服務圖）","B":"Ansible 自動化模組","C":"Panorama 角色型存取控制 (role-based access control, RBAC)","D":"CN-Series 防火牆"}},
{n:16,ans:["C"],topic:"Zone Protection - 偽造IP",stem:"When configuring a Zone Protection profile, in which section (protection type) would an NGFW engineer configure options to protect against activities such as spoofed IP addresses and split handshake session establishment attempts?",opts:{"A":"Flood Protection","B":"Protocol Protection","C":"Packet-Based Attack Protection","D":"Reconnaissance Protection"},qZh:"在設定 Zone Protection profile 時，NGFW 工程師會在哪個區段（保護類型）中設定選項，以防範諸如偽造 IP 位址 (spoofed IP addresses) 與分割握手 (split handshake) 工作階段建立嘗試之類的活動？",optsZh:{"A":"Flood Protection（洪水攻擊防護）","B":"Protocol Protection（協定防護）","C":"Packet-Based Attack Protection（封包式攻擊防護）","D":"Reconnaissance Protection（偵察防護）"}},
{n:17,multi:true,ans:["A","B"],topic:"Tunnel IP 用途",stem:"For which two purposes is an IP address configured on a tunnel interface? (Choose two.)",opts:{"A":"Use of dynamic routing protocols","B":"Tunnel monitoring","C":"Use of peer IP","D":"Redistribution of User-ID"},qZh:"在 tunnel 介面上設定 IP 位址有哪兩個用途？（請選擇兩項）",optsZh:{"A":"用於動態路由協定 (dynamic routing protocols)","B":"用於 tunnel 監控 (Tunnel monitoring)","C":"用於對等端 IP (peer IP)","D":"用於 User-ID 的重新分發 (Redistribution of User-ID)"}},
{n:18,ans:["B"],topic:"User-ID 最可靠來源",stem:"Which PAN-OS method of mapping users to IP addresses is the most reliable?",opts:{"A":"Port mapping","B":"GlobalProtect","C":"Syslog","D":"Server monitoring"},qZh:"在 PAN-OS 中，哪一種將使用者對應 (mapping) 到 IP 位址的方法最為可靠？",optsZh:{"A":"通訊埠對應 (Port mapping)","B":"GlobalProtect","C":"Syslog","D":"伺服器監控 (Server monitoring)"}},
{n:19,ans:["A"],topic:"HA3 介面用途",stem:"In an active/active high availability (HA) configuration with two PA-Series firewalls, how do the firewalls use the HA3 interface?",opts:{"A":"To forward packets to the HA peer during session setup and asymmetric traffic flow","B":"To exchange hellos, heartbeats, HA state information, and management plane synchronization for routing and User-ID information","C":"To synchronize sessions, forwarding tables, IPSec security associations, and ARP tables between firewalls in an HA pair","D":"To perform session cache synchronization among all HA peers having the same cluster ID"},qZh:"在使用兩台 PA-Series 防火牆的 active/active 高可用性 (HA) 設定中，防火牆如何使用 HA3 介面？",optsZh:{"A":"在 session 建立及非對稱流量 (asymmetric traffic flow) 期間，將封包轉發給 HA 對等端 (HA peer)","B":"用於交換 hello 封包、heartbeat、HA 狀態資訊，以及路由與 User-ID 資訊的管理平面同步 (management plane synchronization)","C":"用於在 HA pair 中的防火牆之間同步 session、轉發表 (forwarding tables)、IPSec 安全關聯 (security associations) 與 ARP 表","D":"用於在所有具有相同 cluster ID 的 HA 對等端之間執行 session 快取同步"}},
{n:20,ans:["D"],topic:"Web Proxy + AD",stem:"A PA-Series firewall with all licensable features is being installed. The customer's Security policy requires that users do not directly access websites. Instead, a security device must create the connection, and there must be authentication back to the Active Directory servers for all sessions. Which action meets the requirements in this?",opts:{"A":"Deploy the transparent proxy with Web Cache Communications Protocol (WCCP).","B":"Deploy the Next-Generation Firewalls as normal and install the User-ID agent.","C":"Deploy the Advanced URL Filtering license and captive portal.","D":"Deploy the explicit proxy with Kerberos authentication scheme."},qZh:"正在安裝一台已啟用所有可授權功能的 PA-Series 防火牆。客戶的安全政策 (Security policy) 要求使用者不可直接存取網站，而是必須由一台安全裝置建立連線，且所有 session 都必須回頭向 Active Directory 伺服器進行驗證。下列哪一項作法可滿足這些需求？",optsZh:{"A":"搭配 Web 快取通訊協定 (Web Cache Communications Protocol, WCCP) 部署透明代理 (transparent proxy)。","B":"照常部署 Next-Generation Firewall，並安裝 User-ID agent。","C":"部署 Advanced URL Filtering 授權與 captive portal。","D":"部署搭配 Kerberos 認證機制的明確代理 (explicit proxy)。"}},
{n:21,ans:["D"],topic:"User-based Policy 前置條件",stem:"What must be configured before a firewall administrator can define policy rules based on users and groups?",opts:{"A":"User Mapping profile","B":"Authentication profile","C":"Group mapping settings","D":"LDAP Server profile"},qZh:"在防火牆管理員能夠依據使用者與群組 (users and groups) 來定義政策規則 (policy rules) 之前，必須先設定什麼？",optsZh:{"A":"使用者對應設定檔 (User Mapping profile)","B":"認證設定檔 (Authentication profile)","C":"群組對應設定 (Group mapping settings)","D":"LDAP 伺服器設定檔 (LDAP Server profile)"}},
{n:22,ans:["B"],topic:"Panorama 規則順序",stem:"Which statement applies to the relationship between Panorama-pushed Security policy and local firewall Security policy?",opts:{"A":"When a policy match is found in a local firewall policy, if any Panorama shared post-rule is configured, it will still be evaluated.","B":"Local firewall rules are evaluated after Panorama pre-rules and before Panorama post-rules.","C":"Panorama post-rules can be configured to be evaluated before local firewall policy for the purpose of troubleshooting.","D":"The order of policy evaluation can be configured differently in different device groups."},qZh:"關於 Panorama 推送的安全政策 (Security policy) 與本地防火牆安全政策之間的關係，下列哪一項敘述適用？",optsZh:{"A":"當在本地防火牆政策中找到政策符合項時，若有設定任何 Panorama 共用 post-rule，仍會被評估。","B":"本地防火牆規則會在 Panorama pre-rule 之後、Panorama post-rule 之前被評估。","C":"為了疑難排解 (troubleshooting) 目的，可將 Panorama post-rule 設定為在本地防火牆政策之前被評估。","D":"可在不同的裝置群組 (device groups) 中設定不同的政策評估順序。"}},
{n:23,ans:["A"],topic:"L3 vs L2 功能",stem:"Which networking technology can be configured on Layer 3 interfaces but not on Layer 2 interfaces?",opts:{"A":"DDNS","B":"Link Duplex","C":"NetFlow","D":"LLDP"},qZh:"哪一項網路技術可以設定在 Layer 3 介面上，但無法設定在 Layer 2 介面上？",optsZh:{"A":"DDNS","B":"連結雙工模式 (Link Duplex)","C":"NetFlow","D":"LLDP"}},
{n:24,ans:["D"],topic:"GP Split Tunneling DNS",stem:"What is a result of enabling split tunneling in the GlobalProtect portal configuration with the \"Both Network Traffic and DNS\" option?",opts:{"A":"It specifies when the secondary DNS server is used for resolution to allow access to specific domains that are not managed by the VPN.","B":"It allows users to access internal resources when connected locally and external resources when connected remotely using the same FQDN.","C":"It allows devices on a local network to access blocked websites by changing which DNS server resolves certain domain names.","D":"It specifies which domains are resolved by the VPN-assigned DNS servers and which domains are resolved by the local DNS servers."},qZh:"在 GlobalProtect Portal 設定中，啟用採用「Both Network Traffic and DNS（網路流量與 DNS 兩者）」選項的分割通道 (split tunneling) 會產生什麼結果？",optsZh:{"A":"它指定何時使用次要 DNS 伺服器進行解析，以允許存取未受 VPN 管理的特定網域。","B":"它允許使用者在本地連線時存取內部資源、在遠端連線時使用相同的 FQDN 存取外部資源。","C":"它透過變更由哪一台 DNS 伺服器解析特定網域名稱，讓本地網路上的裝置能夠存取被封鎖的網站。","D":"它指定哪些網域由 VPN 指派的 DNS 伺服器解析，以及哪些網域由本地 DNS 伺服器解析。"}},
{n:25,ans:["A"],topic:"Content Update Threshold",stem:"According to dynamic updates best practices, what is the recommended threshold value for content updates in a mission-critical network?",opts:{"A":"8 hours","B":"16 hours","C":"32 hours","D":"48 hours"},qZh:"依據動態更新 (dynamic updates) 最佳實踐，在關鍵任務 (mission-critical) 網路中，內容更新 (content updates) 建議的門檻值 (threshold value) 為何？",optsZh:{"A":"8 小時","B":"16 小時","C":"32 小時","D":"48 小時"}},
{n:26,ans:["B"],topic:"VSYS 資源限制",stem:"Which type of firewall resource can be assigned when configuring a new firewall virtual system (VSYS)?",opts:{"A":"CPU","B":"Sessions limit","C":"Memory","D":"Security profile limit"},qZh:"在設定新的防火牆虛擬系統 (virtual system, VSYS) 時，可以指派哪一種類型的防火牆資源？",optsZh:{"A":"CPU","B":"Session 數量上限 (Sessions limit)","C":"記憶體 (Memory)","D":"安全設定檔上限 (Security profile limit)"}},
{n:27,ans:["A"],topic:"Log Forwarding 方式",stem:"Which forwarding methods can be used on the Objects tab when configuring the Log Forwarding profile?",opts:{"A":"Panorama, syslog, email","B":"Syslog, HTTP, NetFlow","C":"Panorama, ADEM, syslog","D":"SNMP, HTTP, RADIUS"},qZh:"在設定 Log Forwarding 設定檔時，Objects 頁籤上可以使用哪些轉發方法 (forwarding methods)？",optsZh:{"A":"Panorama、syslog、email","B":"Syslog、HTTP、NetFlow","C":"Panorama、ADEM、syslog","D":"SNMP、HTTP、RADIUS"}},
{n:28,ans:["D"],topic:"Ansible 功能",stem:"In a hybrid cloud deployment, what is the primary function of Ansible in managing Palo Alto Networks NGFWs?",opts:{"A":"It provides a web interface for managing NGFW hardware clusters.","B":"It enables centralized log collection and correlation for NGFWs.","C":"It facilitates dynamic updates to NGFW threat databases.","D":"It automates NGFW policy updates and configurations through playbooks."},qZh:"在混合雲 (hybrid cloud) 部署中，Ansible 在管理 Palo Alto Networks NGFW 時的主要功能為何？",optsZh:{"A":"它提供一個 Web 介面來管理 NGFW 硬體叢集 (hardware clusters)。","B":"它為 NGFW 啟用集中式日誌收集與關聯分析 (log collection and correlation)。","C":"它促成對 NGFW 威脅資料庫 (threat databases) 的動態更新。","D":"它透過 playbook 自動化 NGFW 政策更新與設定。"}},
{n:29,multi:true,ans:["C","D"],topic:"SSL/TLS Profile 用途",stem:"Palo Alto Networks NGFWs use SSL/TLS profiles to secure which two types of connections? (Choose two.)",opts:{"A":"NAT tables","B":"User Authentication","C":"GlobalProtect Gateways","D":"GlobalProtect Portal"},qZh:"Palo Alto Networks NGFW 使用 SSL/TLS 設定檔 (profiles) 來保護哪兩種類型的連線？（請選擇兩項）",optsZh:{"A":"NAT 表 (NAT tables)","B":"使用者認證 (User Authentication)","C":"GlobalProtect Gateways","D":"GlobalProtect Portal"}},
{n:30,ans:["D"],topic:"Route 選擇邏輯",stem:"How does a Palo Alto Networks firewall choose the best route when it receives routes for the same destination from different routing protocols?",opts:{"A":"The route that was received first will be entered into the forwarding table, and all subsequent routes will be rejected.","B":"It will attempt to load balance the traffic across all routes.","C":"It compares the administrative distance and chooses the one with the highest value.","D":"It compares the administrative distance and chooses the one with the lowest value."},qZh:"當 Palo Alto Networks 防火牆從不同的路由協定 (routing protocols) 收到通往相同目的地的路由時，它如何選擇最佳路由？",optsZh:{"A":"最先收到的路由會被加入轉發表 (forwarding table)，後續所有路由都會被拒絕。","B":"它會嘗試在所有路由之間對流量進行負載平衡 (load balance)。","C":"它會比較管理距離 (administrative distance)，並選擇數值最高的那一條。","D":"它會比較管理距離 (administrative distance)，並選擇數值最低的那一條。"}},
{n:31,ans:["B"],topic:"AD CS + OCSP 大型部署",stem:"A large enterprise wants to implement certificate-based authentication for both users and devices, using an on-premises Microsoft Active Directory Certificate Services (AD CS) hierarchy as the primary certificate authority (CA). The enterprise also requires Online Certificate Status Protocol (OCSP) checks to ensure efficient revocation status updates and reduce the overhead on its NGFWs. The environment includes multiple Active Directory forests, Panorama management for several geographically dispersed firewalls, GlobalProtect portals and gateways needing distinct certificate profiles for users and devices, and strict Security policies demanding frequent revocation checks with minimal latency. Which approach best addresses these requirements while maintaining consistent policy enforcement?",opts:{"A":"Deploy self-signed certificates at each site to simplify local certificate validation and reduce dependencies on a centralized CA. Turn off certificate revocation checks for lower overhead, rely on IP-based rules for GlobalProtect authentication, and use a single certificate profile for both users and devices.","B":"Distribute the root and intermediate CA certificates via Panorama as shared objects to ensure all firewalls have a consistent trust chain. Configure OCSP responder profiles on each firewall to offload revocation checks to an internal OCSP server while keeping CRL checks as a fallback. Maintain separate certificate profiles for user and device authentication and use an automated enrollment method – such as Group Policy or SCEP – to deploy certificates to endpoints.","C":"Configure each firewall independently to trust the root and intermediate CA certificates. Rely only on manual CRL checks for certificate revocation, and import both user and device certificates directly into each firewall's local certificate store for authentication.","D":"Obtain wildcard certificates from a public CA for both user and device authentication, and configure firewalls to perform CRL polling at the default update interval. Manually install user certificates on endpoints and synchronize firewall certificate stores through frequent manual SSH updates to maintain consistency."},qZh:"一家大型企業想要對使用者與裝置兩者實作憑證式認證 (certificate-based authentication)，並使用內部部署 (on-premises) 的 Microsoft Active Directory Certificate Services (AD CS) 階層作為主要憑證授權單位 (certificate authority, CA)。該企業還要求進行線上憑證狀態通訊協定 (Online Certificate Status Protocol, OCSP) 檢查，以確保高效率的撤銷狀態更新，並降低其 NGFW 的負擔。此環境包含多個 Active Directory 樹系 (forests)、用於管理數個地理上分散之防火牆的 Panorama、需要為使用者與裝置設定不同憑證設定檔 (certificate profiles) 的 GlobalProtect Portal 與 Gateway，以及要求以最低延遲頻繁進行撤銷檢查的嚴格安全政策 (Security policies)。哪一種作法最能滿足這些需求，同時維持一致的政策落實 (policy enforcement)？",optsZh:{"A":"在每個站點部署自簽憑證 (self-signed certificates)，以簡化本地憑證驗證並減少對集中式 CA 的依賴。關閉憑證撤銷檢查以降低負擔，依賴 IP 式規則進行 GlobalProtect 認證，並對使用者與裝置使用單一憑證設定檔。","B":"透過 Panorama 以共用物件 (shared objects) 的形式分發 Root 與 Intermediate CA 憑證，確保所有防火牆都擁有一致的信任鏈 (trust chain)。在每台防火牆上設定 OCSP responder 設定檔，將撤銷檢查卸載 (offload) 至內部 OCSP 伺服器，同時保留 CRL 檢查作為後援 (fallback)。為使用者與裝置認證維護各自獨立的憑證設定檔，並使用自動化註冊方法（例如 Group Policy 或 SCEP）將憑證部署至端點 (endpoints)。","C":"獨立設定每台防火牆使其信任 Root 與 Intermediate CA 憑證。僅依賴手動 CRL 檢查進行憑證撤銷，並將使用者與裝置憑證直接匯入每台防火牆的本地憑證儲存區進行認證。","D":"從公開 CA 取得萬用字元憑證 (wildcard certificates) 供使用者與裝置認證使用，並設定防火牆以預設更新間隔執行 CRL 輪詢 (polling)。在端點上手動安裝使用者憑證，並透過頻繁的手動 SSH 更新來同步防火牆憑證儲存區以維持一致性。"}},
{n:32,ans:["C"],topic:"CN-Series 多雲部署",stem:"An organization runs multiple Kubernetes clusters both on-premises and in public clouds (AWS, Azure, GCP). They want to deploy the Palo Alto Networks CN-Series NGFW to secure east-west traffic within each cluster, maintain consistent Security policies across all environments, and dynamically scale as containerized workloads spin up or down. They also plan to use a centralized Panorama instance for policy management and visibility. Which approach meets these requirements?",opts:{"A":"Install standalone CN-Series instances in each cluster with local configuration only. Export daily policy configuration snapshots to Panorama for recordkeeping, but do not unify policy enforcement.","B":"Configure the CN-Series only in public cloud clusters, and rely on Kubernetes Network Policies for on-premises cluster security. Synchronize partial policy information into Panorama manually as needed.","C":"Use Kubernetes-native deployment tools (e.g., Helm) to deploy CN-Series in each cluster, ensuring local insertion into the service mesh or CNI. Manage all CN-Series firewalls centrally from Panorama, applying uniform Security policies across on-premises and cloud clusters.","D":"Deploy a single CN-Series firewall in the on-premises data center to process traffic for all clusters, connecting remote clusters via VPN or peering. Manage this single instance through Panorama."},qZh:"某組織在內部部署 (on-premises) 與公有雲（AWS、Azure、GCP）中同時執行多個 Kubernetes 叢集。他們想要部署 Palo Alto Networks CN-Series NGFW 以保護每個叢集內的東西向流量 (east-west traffic)、在所有環境中維持一致的安全政策 (Security policies)，並隨著容器化工作負載 (containerized workloads) 的擴增或縮減而動態調整規模。他們也計畫使用一個集中式的 Panorama 來進行政策管理與可視性 (visibility)。哪一種作法可滿足這些需求？",optsZh:{"A":"在每個叢集中安裝僅具本地設定的獨立 CN-Series 實例。每日將政策設定快照 (snapshots) 匯出至 Panorama 以供記錄保存，但不統一政策落實 (policy enforcement)。","B":"僅在公有雲叢集中設定 CN-Series，並依賴 Kubernetes Network Policies 來保護內部部署叢集的安全。視需要手動將部分政策資訊同步至 Panorama。","C":"使用 Kubernetes 原生部署工具（例如 Helm）在每個叢集中部署 CN-Series，確保本地插入至 service mesh 或 CNI。透過 Panorama 集中管理所有 CN-Series 防火牆，在內部部署與雲端叢集中套用一致的安全政策 (Security policies)。","D":"在內部部署資料中心部署單一一台 CN-Series 防火牆來處理所有叢集的流量，並透過 VPN 或對等互連 (peering) 連接遠端叢集。透過 Panorama 管理這個單一實例。"}},
{n:33,ans:["C"],topic:"CSP 多 AZ HA",stem:"When deploying Palo Alto Networks NGFWs in a cloud service provider (CSP) environment, which method ensures high availability (HA) across multiple availability zones?",opts:{"A":"Deploying Ansible scripts for zone-specific scaling","B":"Implementing Terraform templates for redundancy within one availability zone","C":"Using load balancer and health probes","D":"Configuring active/active HA"},qZh:"在雲端服務供應商 (Cloud Service Provider, CSP) 環境中部署 Palo Alto Networks NGFW 時，哪種方法可確保跨多個可用區 (Availability Zone) 的高可用性 (HA)？",optsZh:{"A":"部署 Ansible 腳本以進行特定可用區的擴展","B":"實作 Terraform 範本以在單一可用區內提供冗餘","C":"使用負載平衡器 (Load Balancer) 與健康偵測 (Health Probes)","D":"設定 active/active 高可用性 (HA)"}},
{n:34,ans:["A"],topic:"Q34",stem:"An engineer at a managed services provider is updating an application that allows its customers to request firewall changes to also manage SD-WAN. The application will be able to make any approved changes directly to devices via API. What is a requirement for the application to create SD-WAN interfaces?",opts:{"A":"REST API's \"sdwanInterfaceprofiles\" parameter on a Panorama device","B":"REST API's \"sdwanInterfaces\" parameter on a firewall device","C":"XML API's \"sdwanprofiles/interfaces\" parameter on a Panorama device","D":"XML API's \"InterfaceProfiles/sdwan\" parameter on a firewall device"},qZh:"某託管服務供應商 (Managed Services Provider) 的工程師正在更新一套應用程式，該應用程式原本讓客戶可以請求防火牆變更，現在還要能管理 SD-WAN。此應用程式將能夠透過 API 直接對裝置進行任何已核准的變更。此應用程式要建立 SD-WAN 介面，其需求為何？",optsZh:{"A":"在 Panorama 裝置上使用 REST API 的「sdwanInterfaceprofiles」參數","B":"在防火牆裝置上使用 REST API 的「sdwanInterfaces」參數","C":"在 Panorama 裝置上使用 XML API 的「sdwanprofiles/interfaces」參數","D":"在防火牆裝置上使用 XML API 的「InterfaceProfiles/sdwan」參數"}},
{n:35,multi:true,ans:["A","D"],topic:"後量子加密 IKE",stem:"Which two actions in the IKE Gateways will allow implementation of post-quantum cryptography when building VPNs between multiple Palo Alto Networks NGFWs? (Choose two.)",opts:{"A":"Select IKE v2, enable the Advanced Options → PQ PPK, then set a 64+ character string for the post-quantum pre shared key.","B":"Ensure Authentication is set to \"certificate,\" then import a post-quantum derived certificate.","C":"Select IKE v2 Preferred, enable the Advanced Options → PQ KEM, then add one or more \"Rounds.\"","D":"Select IKE v2, enable the Advanced Options → PQ KEM, then create an IKE Crypto Profile with Advanced Options adding one or more \"Rounds.\""},qZh:"在多台 Palo Alto Networks NGFW 之間建立 VPN 時，IKE Gateway 中的哪兩個動作可實作後量子加密 (post-quantum cryptography)？(請選兩項)",optsZh:{"A":"選擇 IKE v2，啟用 Advanced Options → PQ PPK，然後為後量子預共用金鑰 (post-quantum pre-shared key) 設定一個 64 字元以上的字串。","B":"確保驗證 (Authentication) 設定為「certificate」，然後匯入一張後量子衍生的憑證 (post-quantum derived certificate)。","C":"選擇 IKE v2 Preferred，啟用 Advanced Options → PQ KEM，然後新增一個或多個「Rounds」。","D":"選擇 IKE v2，啟用 Advanced Options → PQ KEM，然後建立一個 IKE Crypto Profile，並在其 Advanced Options 中新增一個或多個「Rounds」。"}},
{n:36,ans:["B"],topic:"Inter-VSYS Visible",stem:"An NGFW engineer is establishing bidirectional connectivity between the accounting virtual system (VSYS) and the marketing VSYS. The traffic needs to transition between zones without leaving the firewall (no external physical connections). The interfaces for each VSYS are assigned to separate virtual routers (VRs), and inter-VR static routes have been configured. An external zone has been created correctly for each VSYS. Security policies have been added to permit the desired traffic between each zone and its respective external zone. However, the desired traffic is still unable to successfully pass from one VSYS to the other in either direction. Which additional configuration task is required to resolve this issue?",opts:{"A":"Create a transit VSYS and route all inter-VSYS traffic through it.","B":"Add each VSYS to the list of visible virtual systems of the other VSYS.","C":"Enable the \"allow inter-VSYS traffic\" option in both external zone configurations.","D":"Create Security policies to allow the traffic between the two external zones."},qZh:"某 NGFW 工程師正在為會計虛擬系統 (VSYS) 與行銷虛擬系統 (VSYS) 建立雙向連線。流量需要在各區域 (zone) 之間轉換，但不離開防火牆 (無外部實體連線)。每個 VSYS 的介面被指派到各自獨立的虛擬路由器 (Virtual Router, VR)，且已設定 VR 之間的靜態路由 (inter-VR static routes)。每個 VSYS 也都已正確建立一個外部區域 (external zone)。已新增安全政策 (Security policy) 以允許各區域與其各自外部區域之間所需的流量。然而，所需的流量在兩個方向上仍無法成功從一個 VSYS 通過到另一個 VSYS。要解決此問題，還需要哪項額外的設定工作？",optsZh:{"A":"建立一個中繼 VSYS (transit VSYS)，並將所有 VSYS 間的流量透過它路由。","B":"將每個 VSYS 加入另一個 VSYS 的可見虛擬系統 (visible virtual systems) 清單中。","C":"在兩個外部區域 (external zone) 的設定中啟用「allow inter-VSYS traffic」選項。","D":"建立安全政策 (Security policy) 以允許兩個外部區域 (external zone) 之間的流量。"}},
{n:37,ans:["C"],topic:"Panorama 無 Context Switch",stem:"Without performing a context switch, which set of operations can be performed that will affect the operation of a connected firewall on the Panorama GUI?",opts:{"A":"Restarting the local firewall, running a packet capture, accessing the firewall CLI","B":"Modification of local security rules, modification of a Layer 3 interface, modification of the firewall device hostname","C":"Modification of pre-security rules, modification of a virtual router, modification of an IKE Gateway Network Profile","D":"Modification of post NAT rules, creation of new views on the local firewall ACC tab, creation of local custom reports"},qZh:"在不執行情境切換 (context switch) 的情況下，於 Panorama GUI 上可執行哪一組會影響所連接防火牆運作的操作？",optsZh:{"A":"重新啟動本地防火牆、執行封包擷取 (packet capture)、存取防火牆 CLI","B":"修改本地安全規則 (local security rules)、修改第 3 層 (Layer 3) 介面、修改防火牆裝置主機名稱","C":"修改 pre-security rules、修改虛擬路由器 (Virtual Router)、修改 IKE Gateway 網路設定檔 (Network Profile)","D":"修改 post NAT rules、在本地防火牆的 ACC 頁籤上建立新檢視 (view)、建立本地自訂報表 (custom reports)"}},
{n:38,ans:["B"],topic:"Custom Report 詳細日誌",stem:"Which set of options is available for detailed logs when building a custom report on a Palo Alto Networks NGFW?",opts:{"A":"Traffic, User-ID, URL","B":"Traffic, threat, data filtering, User-ID","C":"GlobalProtect, traffic, application statistics","D":"Threat, GlobalProtect, application statistics, WildFire submissions"},qZh:"在 Palo Alto Networks NGFW 上建立自訂報表 (custom report) 時，詳細日誌 (detailed logs) 有哪一組選項可供使用？",optsZh:{"A":"Traffic、User-ID、URL","B":"Traffic、threat、data filtering、User-ID","C":"GlobalProtect、traffic、application statistics","D":"Threat、GlobalProtect、application statistics、WildFire submissions"}},
{n:39,ans:["A"],topic:"HA 升級流程",stem:"An administrator plans to upgrade a pair of active/passive firewalls to a new PAN-OS release. The environment is highly sensitive, and downtime must be minimized. What is the recommended upgrade process for minimal disruption in this high availability (HA) scenario?",opts:{"A":"Suspend the active firewall to trigger a failover to the passive firewall. With traffic now running on the former passive unit, upgrade the suspended (now passive) firewall and confirm proper operation. Then fail traffic back and upgrade the remaining firewall.","B":"Shut down the currently active firewall and upgrade it offline, allowing the passive firewall to handle all traffic. Once the active firewall finishes upgrading, bring it back online and rejoin the HA cluster. Finally, upgrade the passive firewall while the newly upgraded unit remains active.","C":"Isolate both firewalls from the production environment and upgrade them in a separate, offline setup. Reconnect them only after validating the new software version, resuming HA functionality once both units are fully upgraded and tested.","D":"Push the new PAN-OS version simultaneously to both firewalls, having them upgrade and reboot in parallel. Rely on automated HA reconvergence to restore normal operations without manually failing over traffic."},qZh:"某管理員計畫將一對 active/passive 防火牆升級至新的 PAN-OS 版本。此環境高度敏感，必須將停機時間 (downtime) 降至最低。在此高可用性 (HA) 情境下，建議採用何種升級流程以將中斷降至最低？",optsZh:{"A":"暫停 (suspend) active 防火牆以觸發容錯移轉 (failover) 至 passive 防火牆。當流量已改在原 passive 單元上運行後，升級已暫停 (現為 passive) 的防火牆並確認其運作正常。接著將流量切回，再升級剩下的那台防火牆。","B":"關閉目前的 active 防火牆並離線升級，讓 passive 防火牆處理所有流量。當 active 防火牆升級完成後，將其重新上線並重新加入 HA 叢集。最後，在新升級的單元保持為 active 的同時升級 passive 防火牆。","C":"將兩台防火牆與正式環境隔離，並在另一個獨立的離線環境中升級它們。僅在驗證新軟體版本後再重新連線，待兩台單元完全升級並測試完成後恢復 HA 功能。","D":"將新的 PAN-OS 版本同時推送至兩台防火牆，讓它們並行升級並重新開機。依靠自動化的 HA 重新收斂 (reconvergence) 來恢復正常運作，而不需手動切換流量。"}},
{n:40,multi:true,ans:["C","D"],topic:"External Zone 屬性",stem:"Which two statements describe an external zone in the context of virtual systems (VSYS) on a Palo Alto Networks firewall? (Choose two.)",opts:{"A":"It is associated with an interface within a VSYS of a firewall.","B":"It is a security object associated with a specific virtual router of a VSYS.","C":"It is not associated with an interface; it is associated with a VSYS itself.","D":"It is a security object associated with a specific VSYS."},qZh:"在 Palo Alto Networks 防火牆的虛擬系統 (VSYS) 情境中，哪兩項陳述描述了外部區域 (external zone)？(請選兩項)",optsZh:{"A":"它與防火牆某個 VSYS 內的某個介面相關聯。","B":"它是與某個 VSYS 的特定虛擬路由器 (Virtual Router) 相關聯的 security 物件。","C":"它不與介面相關聯；它與 VSYS 本身相關聯。","D":"它是與特定 VSYS 相關聯的 security 物件。"}},
{n:41,ans:["C"],topic:"Inter-VSYS Zone 類型",stem:"Which zone type allows traffic between zones in different virtual systems (VSYS), without the traffic leaving the firewall?",opts:{"A":"Isolated","B":"Transient","C":"External","D":"Internal"},qZh:"哪種區域 (zone) 類型可允許不同虛擬系統 (VSYS) 中各區域之間的流量，且流量不離開防火牆？",optsZh:{"A":"Isolated","B":"Transient","C":"External","D":"Internal"}},
{n:42,ans:["D"],topic:"CIE 多區隔離",stem:"A multinational organization wants to use the Cloud Identity Engine (CIE) to aggregate identity data from multiple sources (on premises AD, Azure AD, Okta) while enforcing strict data isolation for different regional business units. Each region's firewalls, managed via Panorama, must only receive the user and group information relevant to that region. The organization aims to minimize administrative overhead while meeting data sovereignty requirements. Which approach achieves this segmentation of identity data?",opts:{"A":"Create one CIE tenant, aggregate all identity data into a single view, and redistribute the full dataset to all firewalls. Rely on per-firewall Security policies to restrict access to out-of-scope user and group information.","B":"Establish separate CIE tenants for each business unit, integrating each tenant with the relevant identity sources. Redistribute user and group data from each tenant only to the region's firewalls, maintaining a strict one-to-one mapping of tenant to business unit.","C":"Disable redistribution of identity data entirely. Instead, configure each regional firewall to pull user and group details directly from its local identity providers (IdPs).","D":"Deploy a single CIE tenant that collects all identity data, then configure segments within the tenant to filter and redistribute only the relevant user/group sets to each regional firewall group."},qZh:"某跨國組織希望使用 Cloud Identity Engine (CIE) 從多個來源 (地端 AD、Azure AD、Okta) 彙整身分資料，同時為不同的區域業務單位 (regional business units) 強制實施嚴格的資料隔離。每個區域的防火牆 (透過 Panorama 管理) 只能接收與該區域相關的使用者與群組資訊。該組織的目標是在滿足資料主權 (data sovereignty) 需求的同時，將管理負擔降至最低。哪種方法可達成此身分資料的區隔？",optsZh:{"A":"建立單一 CIE 租戶 (tenant)，將所有身分資料彙整為單一檢視，並將完整資料集重新分發 (redistribute) 給所有防火牆。依靠各防火牆的安全政策 (Security policy) 來限制存取超出範圍的使用者與群組資訊。","B":"為每個業務單位建立各自獨立的 CIE 租戶，將每個租戶與相關的身分來源整合。將每個租戶的使用者與群組資料僅重新分發給該區域的防火牆，維持租戶對業務單位的嚴格一對一對應。","C":"完全停用身分資料的重新分發。改為設定每個區域防火牆直接從其本地身分提供者 (Identity Providers, IdPs) 拉取使用者與群組詳細資料。","D":"部署單一 CIE 租戶以收集所有身分資料，然後在租戶內設定區段 (segments) 來篩選，並只將相關的使用者/群組集合重新分發給各個區域防火牆群組。"}},
{n:43,multi:true,ans:["A","C"],topic:"SAML+RADIUS 並行",stem:"An engineer is implementing a new rollout of SAML for administrator authentication across a company's Palo Alto Networks NGFWs. User authentication on company firewalls is currently performed with RADIUS, which will remain available for six months, until it is decommissioned. The company wants both authentication types to be running in parallel during the transition to SAML. Which two actions meet the criteria? (Choose two.)",opts:{"A":"Create a testing and rollback plan for the transition from Radius to SAML, as the two authentication profiles cannot be run in tandem.","B":"Create an authentication sequence that includes both the \"RADIUS\" Server Profile and \"SAML Identity Provider\" Server Profile to run the two services in tandem.","C":"Create and apply an authentication profile with the \"SAML Identity Provider\" Server Profile.","D":"Create and add the \"SAML Identity Provider\" Server Profile to the authentication profile for the \"RADIUS\" Server Profile."},qZh:"某工程師正在某公司的 Palo Alto Networks NGFW 上全新導入 SAML 以進行管理員驗證。目前公司防火牆上的使用者驗證是以 RADIUS 執行，該機制將繼續沿用六個月，直到除役為止。公司希望在轉換至 SAML 的過渡期間，讓兩種驗證類型並行運作。哪兩個動作符合此條件？(請選兩項)",optsZh:{"A":"為從 RADIUS 轉換至 SAML 建立一份測試與回滾 (rollback) 計畫，因為這兩個驗證設定檔 (authentication profiles) 無法同時並行運作。","B":"建立一個驗證序列 (authentication sequence)，同時納入「RADIUS」Server Profile 與「SAML Identity Provider」Server Profile，使兩項服務並行運作。","C":"建立並套用一個使用「SAML Identity Provider」Server Profile 的驗證設定檔 (authentication profile)。","D":"建立「SAML Identity Provider」Server Profile，並將其加入原本使用「RADIUS」Server Profile 的驗證設定檔 (authentication profile) 中。"}},
{n:44,ans:["B"],topic:"GP 雙憑證 + OCSP",stem:"An enterprise uses GlobalProtect with both user- and machine-based certificate authentication and requires pre-logon, OCSP checks, and minimal user disruption. They manage multiple firewalls via Panorama and deploy domain-issued machine certificates via Group Policy. Which approach ensures continuous, secure connectivity and consistent policy enforcement?",opts:{"A":"Use a wildcard certificate from a public CA, disable all revocation checks to reduce latency, and manage certificate renewals manually on each firewall.","B":"Distribute root and intermediate CAs via Panorama template, use distinct certificate profiles for user versus machine certs, reference an internal OCSP responder, and automate certificate deployment with Group Policy.","C":"Configure a single certificate profile for both user and machine certificates. Rely solely on CRLs for revocation to minimize complexity.","D":"Deploy self-signed certificates on each firewall, allow IP-based authentication to override certificate checks, and use default GlobalProtect settings for user / machine identification."},qZh:"某企業使用 GlobalProtect，並同時採用使用者憑證 (user-based) 與機器憑證 (machine-based) 驗證，且需要 pre-logon、OCSP 檢查，以及將使用者干擾降至最低。他們透過 Panorama 管理多台防火牆，並透過群組原則 (Group Policy) 部署網域核發的機器憑證。哪種方法可確保持續、安全的連線以及一致的政策強制執行？",optsZh:{"A":"使用公有 CA 核發的萬用字元憑證 (wildcard certificate)，停用所有撤銷檢查 (revocation checks) 以降低延遲，並在每台防火牆上手動管理憑證更新。","B":"透過 Panorama template 分發 Root 與 Intermediate CA，為使用者憑證與機器憑證使用各自獨立的憑證設定檔 (certificate profiles)，參照內部 OCSP responder，並以群組原則 (Group Policy) 自動化憑證部署。","C":"為使用者憑證與機器憑證設定單一憑證設定檔 (certificate profile)。僅依賴 CRL 進行撤銷檢查以降低複雜度。","D":"在每台防火牆上部署自簽憑證 (self-signed certificates)，允許以 IP 為基礎的驗證覆寫憑證檢查，並使用 GlobalProtect 預設設定進行使用者/機器識別。"}},
{n:45,ans:["C"],topic:"Log Collector Group",stem:"Which statement applies to Log Collector Groups?",opts:{"A":"Log redundancy is available only if each Log Collector has the same amount of total disk storage.","B":"Enabling redundancy increases the log processing traffic in a Collector Group by 50%.","C":"In any single Collector Group, all the Log Collectors must run on the same Panorama model.","D":"The maximum number of Log Collectors in a Log Collector Group is 18 plus two hot spares."},qZh:"關於 Log Collector Group，哪項陳述為真？",optsZh:{"A":"只有在每個 Log Collector 都具備相同的磁碟總儲存量時，才能提供日誌冗餘 (log redundancy)。","B":"啟用冗餘 (redundancy) 會使 Collector Group 中的日誌處理流量增加 50%。","C":"在任何單一 Collector Group 中，所有的 Log Collector 都必須運行於相同的 Panorama 型號上。","D":"一個 Log Collector Group 中的 Log Collector 最大數量為 18 個，外加兩個熱備援 (hot spares)。"}},
{n:46,ans:["C"],topic:"HA Link Monitoring",stem:"Which interface types should be used to configure link monitoring for a high availability (HA) deployment on a Palo Alto Networks NGFW?",opts:{"A":"HA, Virtual Wire, and Layer 2","B":"Tap, Virtual Wire, and Layer 3","C":"Virtual Wire, Layer 2, and Layer 3","D":"HA, Layer 2, and Layer 3"},qZh:"在 Palo Alto Networks NGFW 上設定高可用性 (HA) 部署的鏈路監控 (link monitoring) 時，應使用哪些介面類型？",optsZh:{"A":"HA、Virtual Wire 與 Layer 2","B":"Tap、Virtual Wire 與 Layer 3","C":"Virtual Wire、Layer 2 與 Layer 3","D":"HA、Layer 2 與 Layer 3"}},
{n:47,ans:["C"],topic:"Mgmt DHCP CLI",stem:"Which CLI command is used to configure the management interface as a DHCP client?",opts:{"A":"set network dhcp interface management","B":"set network dhcp type management-interface","C":"set deviceconfig system type dhcp-client","D":"set deviceconfig management type dhcp-client"},qZh:"哪個 CLI 指令用於將管理介面 (management interface) 設定為 DHCP 用戶端 (DHCP client)？",optsZh:{"A":"set network dhcp interface management","B":"set network dhcp type management-interface","C":"set deviceconfig system type dhcp-client","D":"set deviceconfig management type dhcp-client"}},
{n:48,ans:["A"],topic:"自簽 CA SSL Decryption",stem:"Which configuration step is required when implementing a new self-signed root certificate authority (CA) certificate for SSL decryption on a Palo Alto Networks firewall?",opts:{"A":"Import the new subordinate CA certificate into the trust stores of all client devices.","B":"Set the subordinate CA certificate as the default routing certificate for all network traffic.","C":"Configure the subordinate CA to issue certificates with indefinite validity periods.","D":"Disable all existing SSL decryption rules until the new certificate is fully propagated."},qZh:"在 Palo Alto Networks 防火牆上實作一張新的自簽根憑證授權 (self-signed root certificate authority, CA) 憑證以用於 SSL decryption 時，需要哪個設定步驟？",optsZh:{"A":"將新的次級 CA 憑證 (subordinate CA certificate) 匯入所有用戶端裝置的信任憑證儲存區 (trust stores)。","B":"將次級 CA 憑證 (subordinate CA certificate) 設定為所有網路流量的預設路由憑證。","C":"設定次級 CA (subordinate CA) 核發具有無限期有效期 (indefinite validity periods) 的憑證。","D":"在新憑證完全傳播之前，停用所有現有的 SSL decryption 規則。"}},
{n:49,ans:["B"],topic:"AI Runtime Security",stem:"What are the phases of the Palo Alto Networks AI Runtime Security: Network Intercept solution?",opts:{"A":"Scanning, Isolation, Whitelisting, Logging","B":"Discovery, Deployment, Detection, Prevention","C":"Policy Generation, Discovery, Enforcement, Logging","D":"Profiling, Policy Generation, Enforcement, Reporting"},qZh:"Palo Alto Networks AI Runtime Security: Network Intercept 解決方案有哪些階段？",optsZh:{"A":"掃描 (Scanning)、隔離 (Isolation)、加入白名單 (Whitelisting)、記錄 (Logging)","B":"探索 (Discovery)、部署 (Deployment)、偵測 (Detection)、防護 (Prevention)","C":"政策產生 (Policy Generation)、探索 (Discovery)、執行 (Enforcement)、記錄 (Logging)","D":"剖析 (Profiling)、政策產生 (Policy Generation)、執行 (Enforcement)、報告 (Reporting)"}},
{n:50,ans:["C"],topic:"Admin Role Profile",stem:"What is the purpose of assigning an Admin Role Profile to a user in a Palo Alto Networks NGFW?",opts:{"A":"Allow access to all resources without restrictions.","B":"Enable multi-factor authentication (MFA) for administrator access.","C":"Define granular permissions for management tasks.","D":"Restrict access to sensitive report data."},qZh:"在 Palo Alto Networks NGFW 上，指派 Admin Role Profile 給使用者的目的為何？",optsZh:{"A":"允許無限制地存取所有資源。","B":"為管理員存取啟用多因素驗證 (MFA)。","C":"為管理任務定義細粒度的權限。","D":"限制對敏感報表資料的存取。"}},
{n:51,ans:["A"],topic:"Azure 跨 AZ HA",stem:"An organization is deploying VM-Series firewalls in Microsoft Azure to secure its VNets. A key requirement is that the security infrastructure must be resilient to the failure of an entire Azure Availability Zone. What is the recommended method to achieve this goal?",opts:{"A":"Deploy multiple, independent VM-Series firewalls in different Availability Zones and use an Azure Load Balancer to distribute traffic to them.","B":"Implement a Terraform configuration that automatically redeploys the firewall in a new zone if the original one fails.","C":"Use Azure Traffic Manager to direct traffic to a primary VM-Series firewall, with a second firewall in another zone as a failover target.","D":"Configure PAN-OS active/passive high availability (HA) between two VM-Series instances in separate Availability Zones using HA links over a VNet peering connection."},qZh:"某組織正在 Microsoft Azure 中部署 VM-Series 防火牆以保護其 VNet。一項關鍵需求是：安全基礎架構必須能在整個 Azure 可用區 (Availability Zone) 故障時仍維持韌性。達成此目標的建議方法為何？",optsZh:{"A":"在不同的可用區 (Availability Zone) 中部署多個獨立的 VM-Series 防火牆，並使用 Azure Load Balancer 將流量分配給它們。","B":"實作 Terraform 設定，當原始可用區故障時自動將防火牆重新部署到新的可用區。","C":"使用 Azure Traffic Manager 將流量導向主要的 VM-Series 防火牆，並在另一個可用區放置第二台防火牆作為容錯移轉目標。","D":"在不同可用區的兩個 VM-Series 執行個體之間，透過 VNet 對等互連 (VNet peering) 上的 HA 連結設定 PAN-OS active/passive 高可用性 (HA)。"}},
{n:52,ans:["B"],topic:"Log Forwarding 方法集",stem:"When creating a Log Forwarding profile on a PAN-OS firewall to direct logs to various external and internal systems, which set of methods is available?",opts:{"A":"Syslog, Panorama, SD-WAN","B":"Panorama/Cloud logging, email, Syslog","C":"Email, Syslog, NetFlow","D":"HTTP, RADIUS, SNMP"},qZh:"在 PAN-OS 防火牆上建立 Log Forwarding profile，以將日誌導向各種外部與內部系統時，有哪一組方法可供使用？",optsZh:{"A":"Syslog、Panorama、SD-WAN","B":"Panorama/Cloud logging、Email、Syslog","C":"Email、Syslog、NetFlow","D":"HTTP、RADIUS、SNMP"}},
{n:53,ans:["D"],topic:"SSL Forward Proxy 部署",stem:"A company is enabling SSL Forward Proxy to inspect encrypted traffic. A security engineer generates a new certificate on the firewall and flags it with the \"Forward Trust\" certificate property. What is the critical next step that must be performed for decryption to function correctly without causing security warnings for end users?",opts:{"A":"Set the forward trust certificate as the SSL/TLS Service profile for the management interface.","B":"Create a Security policy rule that allows traffic from the certificate of the firewall to all the zones.","C":"Import the private key of the forward trust certificate onto the domain controller.","D":"Install the public portion of the forward trust certificate into the trust store of all client machines."},qZh:"某公司正在啟用 SSL Forward Proxy 以檢測加密流量。一位安全工程師在防火牆上產生一張新憑證，並將其標記為「Forward Trust」憑證屬性。為了讓解密功能正確運作且不會對終端使用者造成安全警告，必須執行的關鍵下一步是什麼？",optsZh:{"A":"將 forward trust 憑證設定為管理介面的 SSL/TLS Service profile。","B":"建立一條 Security policy 規則，允許來自防火牆憑證的流量前往所有區域 (zone)。","C":"將 forward trust 憑證的私鑰匯入網域控制站 (domain controller)。","D":"將 forward trust 憑證的公開部分安裝到所有 client 機器的信任憑證儲存區 (trust store)。"}},
{n:54,multi:true,ans:["A","C"],topic:"Tunnel IP 能力",stem:"An administrator is configuring a site-to-site IPSec VPN and assigns an IP address to the tunnel interface. Which two abilities are enabled by this specific configuration step? (Choose two.)",opts:{"A":"Configuring tunnel monitoring to verify the liveliness of the connection.","B":"Firewall performing NAT traversal.","C":"Running a dynamic routing protocol like OSPF over the tunnel.","D":"Firewall encrypting and decrypting packet payloads."},qZh:"某管理員正在設定一條站對站 (site-to-site) IPSec VPN，並為 tunnel 介面指派一個 IP 位址。這個特定的設定步驟啟用了哪兩項能力？（請選擇兩項。）",optsZh:{"A":"設定 tunnel monitoring 以驗證連線的存活狀態。","B":"讓防火牆執行 NAT 穿透 (NAT traversal)。","C":"在 tunnel 上執行如 OSPF 之類的動態路由協定。","D":"讓防火牆加密與解密封包酬載 (payload)。"}},
{n:55,ans:["A"],topic:"IaC 工具",stem:"A DevOps team is building a repeatable process for deploying new Palo Alto Networks VM-Series firewalls. The entire infrastructure, including virtual networks, subnets, and the firewalls themselves, must be defined in code to ensure consistency and enable version control. Which tool is primarily used for this type of declarative Infrastructure as Code (IaC) provisioning?",opts:{"A":"Terraform","B":"Azure DevOps","C":"Ansible","D":"Panorama"},qZh:"某 DevOps 團隊正在建立一套可重複的流程，用以部署新的 Palo Alto Networks VM-Series 防火牆。整個基礎架構——包括虛擬網路、子網路以及防火牆本身——都必須以程式碼定義，以確保一致性並支援版本控管。哪一種工具主要用於這類宣告式的 Infrastructure as Code (IaC) 佈建？",optsZh:{"A":"Terraform","B":"Azure DevOps","C":"Ansible","D":"Panorama"}},
{n:56,multi:true,ans:["B","C"],topic:"External Zone 屬性",stem:"A network security engineer is segmenting a single firewall into VSYS-A and VSYS-B. For traffic to flow from VSYS-A to VSYS-B, external zones are required. What are two fundamental properties of the external zones needed for this configuration? (Choose two.)",opts:{"A":"They must be linked to the same virtual router as the ingress interface.","B":"They represent their parent VSYS without being tied to a physical or logical interface.","C":"They are a security construct belonging to a single VSYS.","D":"They are automatically created when inter-VSYS routing is enabled."},qZh:"一位網路安全工程師正將單一防火牆切分為 VSYS-A 與 VSYS-B。為了讓流量能從 VSYS-A 流向 VSYS-B，需要使用 external zone。此設定所需的 external zone 有哪兩項基本屬性？（請選擇兩項。）",optsZh:{"A":"它們必須與 ingress 介面連結到相同的 virtual router。","B":"它們代表其所屬的父 VSYS，且不綁定任何實體或邏輯介面。","C":"它們是隸屬於單一 VSYS 的安全構件 (security construct)。","D":"當啟用 inter-VSYS 路由時，它們會被自動建立。"}},
{n:57,ans:["D"],topic:"非SYN/ICMP 碎片",stem:"A network engineer observes a pattern of anomalous traffic hitting an external-facing zone, including a high volume of TCP packets that are not part of a new session handshake (non-SYN), and a large number of ICMP fragments. The engineer decides to apply a Zone Protection profile to mitigate these potential threats. Which protection type within the profile must be configured?",opts:{"A":"Protocol Protection","B":"Flood Protection","C":"Reconnaissance Protection","D":"Packet-Based Attack Protection"},qZh:"一位網路工程師觀察到有一種異常流量模式正衝擊著對外的區域 (external-facing zone)，其中包括大量非屬於新工作階段握手程序 (non-SYN) 的 TCP 封包，以及大量的 ICMP 碎片。該工程師決定套用一個 Zone Protection profile 以緩解這些潛在威脅。必須設定 profile 中的哪一種防護類型？",optsZh:{"A":"Protocol Protection","B":"Flood Protection","C":"Reconnaissance Protection","D":"Packet-Based Attack Protection"}},
{n:58,ans:["C"],topic:"GP Pre-logon 設定",stem:"An administrator is configuring a GlobalProtect pre-logon VPN. The administrator has already imported the necessary internal certificate authority (CA) certificates for issuing machine certificates onto the firewall. Which configuration is required on the GlobalProtect Gateway to enable pre-logon using these machine certificates?",opts:{"A":"Create a device-based Security policy that allows traffic from the pre-logon user to an internal management zone.","B":"Create an authentication profile that points to the machine certificate's CA and assign it by using the client authentication settings of the GlobalProtect Portal.","C":"Create a certificate profile that trusts the machine certificate's CA and assign it within the Gateway Agent → Client Authentication settings.","D":"Configure the Gateway Agent → Tunnel Settings to use IPSec with machine certificate authentication for the pre-logon tunnel."},qZh:"某管理員正在設定 GlobalProtect pre-logon VPN。該管理員已將用於核發機器憑證所需的內部憑證授權單位 (CA) 憑證匯入防火牆。要在 GlobalProtect Gateway 上啟用使用這些機器憑證的 pre-logon，需要進行哪項設定？",optsZh:{"A":"建立一條以裝置為基礎的 Security policy，允許來自 pre-logon 使用者的流量前往內部管理區域 (zone)。","B":"建立一個指向機器憑證 CA 的 authentication profile，並透過 GlobalProtect Portal 的 client authentication 設定加以指派。","C":"建立一個信任機器憑證 CA 的 certificate profile，並在 Gateway Agent → Client Authentication 設定中加以指派。","D":"將 Gateway Agent → Tunnel Settings 設定為使用搭配機器憑證驗證的 IPSec，以建立 pre-logon tunnel。"}},
{n:59,multi:true,ans:["C","D"],topic:"SSL/TLS Service Profile",stem:"A network administrator needs to replace the default self-signed certificate on a firewall with one signed by the company's internal certificate authority (CA). Which two firewall features would require this new certificate to be assigned via an SSL/TLS service profile? (Choose two.)",opts:{"A":"User-ID agent redistribution","B":"RADIUS server authentication","C":"Authentication portal","D":"GlobalProtect gateway"},qZh:"一位網路管理員需要將防火牆上的預設自簽憑證替換為由公司內部憑證授權單位 (CA) 簽署的憑證。哪兩項防火牆功能會要求透過 SSL/TLS service profile 來指派這張新憑證？（請選擇兩項。）",optsZh:{"A":"User-ID agent 再分發 (redistribution)","B":"RADIUS 伺服器驗證","C":"Authentication portal","D":"GlobalProtect gateway"}},
{n:60,ans:["A"],topic:"Check Point Policy-based",stem:"A network administrator is establishing a site-to-site VPN between a Palo Alto Networks firewall and a partner's Check Point Security Gateway. The partner has provided a specific list of local and remote IP address subnets that are permitted through the tunnel. The initial tunnel configuration on the PAN-OS firewall fails during the IKE Phase 2 exchange. Which configuration step is essential to ensure compatibility with the policy-based Check Point gateway?",opts:{"A":"Define the local and remote subnets provided by the partner in the Proxy ID settings.","B":"Create individual Security policies for each pair of local and remote subnets.","C":"Assign a specific IP address to the tunnel interface to match the Check Point gateway.","D":"Enable Dead Peer Detection (DPD) in the IKE Gateway configuration."},qZh:"一位網路管理員正在 Palo Alto Networks 防火牆與合作夥伴的 Check Point Security Gateway 之間建立站對站 (site-to-site) VPN。合作夥伴提供了一份特定的本地與遠端 IP 位址子網路清單，這些子網路被允許通過該 tunnel。在 PAN-OS 防火牆上的初始 tunnel 設定於 IKE Phase 2 交換階段失敗。為確保與這個 policy-based 的 Check Point gateway 相容，哪一個設定步驟是不可或缺的？",optsZh:{"A":"在 Proxy ID 設定中定義合作夥伴所提供的本地與遠端子網路。","B":"為每一對本地與遠端子網路分別建立各自的 Security policy。","C":"為 tunnel 介面指派一個特定的 IP 位址，以符合 Check Point gateway。","D":"在 IKE Gateway 設定中啟用 Dead Peer Detection (DPD)。"}},
{n:61,ans:["A"],topic:"最可靠 User-IP Mapping",stem:"Which method creates the most reliable user-to-IP mapping due to being based on a direct authentication from the user's device to the firewall?",opts:{"A":"Portal authentication","B":"PAN-OS XML API to push mappings","C":"Polling security event logs with a User-ID agent","D":"Authentication logs from Syslog receiver"},qZh:"由於是基於使用者裝置直接向防火牆進行驗證，哪一種方法能建立最可靠的 user-to-IP 對應？",optsZh:{"A":"Portal 驗證 (Portal authentication)","B":"使用 PAN-OS XML API 推送對應關係","C":"以 User-ID agent 輪詢安全事件日誌","D":"來自 Syslog 接收器的驗證日誌"}},
{n:62,ans:["A"],topic:"Q62",stem:"An administrator configures a GlobalProtect gateway with split tunneling for network traffic based on an access route. Users report that public web browsing works, but they cannot resolve the names of internal servers. The administrator determines that all DNS queries are being sent to the public DNS servers configured on the users' endpoints. Which GlobalProtect portal setting should be configured to resolve this issue?",opts:{"A":"Split tunneling for DNS and specify the internal corporate domains in the \"Domain\" list","B":"DNS Proxy feature on the firewall to point clients to the gateway IP for DNS","C":"\"DNS Forwarding\" option on the gateway's tunnel interface","D":"NAT rule to allow DNS traffic from the GlobalProtect clients to the internal DNS servers"},qZh:"某管理員在 GlobalProtect gateway 上設定了以存取路由 (access route) 為基礎的網路流量 split tunneling。使用者回報公開網站瀏覽可正常運作，但無法解析內部伺服器的名稱。管理員判定所有 DNS 查詢都被送往使用者端點上所設定的公開 DNS 伺服器。應設定哪一項 GlobalProtect portal 設定來解決此問題？",optsZh:{"A":"針對 DNS 的 split tunneling，並在「Domain」清單中指定內部公司網域。","B":"在防火牆上啟用 DNS Proxy 功能，將 client 的 DNS 指向 gateway IP。","C":"在 gateway 的 tunnel 介面上啟用「DNS Forwarding」選項。","D":"建立一條 NAT 規則，允許 GlobalProtect client 的 DNS 流量前往內部 DNS 伺服器。"}},
{n:63,ans:["D"],topic:"Q63",stem:"Which initial action is required to configure logical routers?",opts:{"A":"Changing the virtual router type from \"default\" to \"advanced\"","B":"Activating an advanced routing subscription","C":"Committing a new advanced routing software module","D":"Checking \"advanced routing\" in general settings"},qZh:"設定 logical router 時所需的初始動作為何？",optsZh:{"A":"將 virtual router 類型從「default」變更為「advanced」","B":"啟用 advanced routing 訂閱授權","C":"提交 (commit) 一個新的 advanced routing 軟體模組","D":"在 general settings 中勾選「advanced routing」"}},
{n:64,ans:["C"],topic:"零停機升級",stem:"A network security engineer at a 24/7 online retailer is upgrading an active/passive high availability (HA) cluster of PAN-OS firewalls. The primary goal is to perform the upgrade with no service interruption to online transactions. The engineer has already downloaded the new software to both devices. Which sequence of actions will meet this requirement?",opts:{"A":"From Panorama, create a scheduled software update job targeting both firewalls in the HA pair to run at the same time, then rely on the HA election process to manage the failover automatically.","B":"Upgrade the passive firewall first while it is still in the passive state. Once it reboots and is operational, suspend the active firewall to fail over to the newly upgraded device. Then, upgrade the remaining firewall.","C":"Force the active firewall into a suspended state to trigger a failover, then upgrade and reboot it. Suspend the currently active firewall to fail traffic back to the upgraded unit. Upgrade the remaining firewall.","D":"Disable HA synchronization on the active firewall, upgrade the passive firewall, and then re-enable synchronization. Once synchronized, repeat the process on the other firewall."},qZh:"某 24/7 線上零售商的網路安全工程師正在升級一組 active/passive 高可用性 (HA) 的 PAN-OS 防火牆叢集。主要目標是在不中斷線上交易服務的情況下完成升級。該工程師已將新軟體下載至兩台裝置。哪一個動作順序能滿足此需求？",optsZh:{"A":"從 Panorama 建立一個排程的軟體更新作業，鎖定 HA 配對中的兩台防火牆同時執行，然後依賴 HA 選舉程序自動管理容錯移轉。","B":"先在 passive 防火牆仍處於 passive 狀態時將其升級。待其重新開機並可運作後，suspend active 防火牆以容錯移轉至剛升級完成的裝置。接著升級剩下的那台防火牆。","C":"強制將 active 防火牆置於 suspend 狀態以觸發容錯移轉，然後升級並重新開機。再 suspend 目前的 active 防火牆，使流量切回已升級的裝置。接著升級剩下的那台防火牆。","D":"在 active 防火牆上停用 HA 同步，升級 passive 防火牆，然後重新啟用同步。同步完成後，在另一台防火牆上重複此程序。"}},
{n:65,ans:["A"],topic:"Explicit Web Proxy AD SSO",stem:"A government agency needs to ensure that all user web access is explicitly mediated and authenticated. The agency has the following requirements:\n- Client browsers must be manually configured to send traffic to the firewall's IP address and a specific port.\n- The firewall must support seamless single sign-on (SSO) with the users' existing Active Directory credentials.\n\nWhich feature set should the engineer configure to meet the agency's requirements?",opts:{"A":"Web proxy in explicit mode with an Authentication policy by using Kerberos","B":"Decryption policy that redirects users to a SAML identity provider for authentication","C":"Web proxy in transparent mode with an Authentication policy by using multi-factor authentication (MFA)","D":"User-ID agent integration with Authentication Portal for authentication"},qZh:"某政府機關需要確保所有使用者的網頁存取都經過明確的中介與驗證。該機關有以下需求：\n- 用戶端瀏覽器必須手動設定為將流量送往防火牆的 IP 位址與特定連接埠。\n- 防火牆必須支援以使用者既有 Active Directory 認證進行的無縫單一登入 (single sign-on, SSO)。\n\n工程師應設定哪一組功能以滿足該機關的需求？",optsZh:{"A":"顯式 (explicit) 模式的 Web Proxy 搭配使用 Kerberos 的驗證政策 (Authentication policy)","B":"將使用者重新導向至 SAML 身分提供者 (identity provider) 進行驗證的解密政策 (Decryption policy)","C":"透明 (transparent) 模式的 Web Proxy 搭配使用多因素驗證 (multi-factor authentication, MFA) 的驗證政策 (Authentication policy)","D":"User-ID 代理程式整合 Authentication Portal 進行驗證"}},
{n:66,ans:["B"],topic:"金融業 Content Update",stem:"A network security engineer is reviewing the dynamic update settings for a fleet of firewalls in a financial institution that has a policy prioritizing operational stability above all else. The engineer notes that the current content update threshold is set to 24 hours. Following the Palo Alto Networks recommended best practices for mission-critical deployments, which adjustment should be made to the threshold?",opts:{"A":"Change to \"download only\" and schedule manual installation.","B":"Increase to 48 hours.","C":"Decrease to 12 hours.","D":"Reset to reconfirm 24 hours."},qZh:"某網路安全工程師正在檢視一家金融機構防火牆群的動態更新 (dynamic update) 設定，該機構的政策將營運穩定性置於一切之上。工程師注意到目前的內容更新門檻 (content update threshold) 設定為 24 小時。依照 Palo Alto Networks 對於關鍵任務 (mission-critical) 部署所建議的最佳實務，應如何調整此門檻？",optsZh:{"A":"改為「download only」(僅下載) 並排程手動安裝。","B":"增加至 48 小時。","C":"降低至 12 小時。","D":"重設以重新確認為 24 小時。"}},
{n:67,ans:["A"],topic:"Security Policy 順序",stem:"What is the correct sequence of evaluation for Security policy rulebases?",opts:{"A":"Panorama Pre-Rules → Local Firewall Rules → Panorama Post-Rules","B":"Panorama Post-Rules → Panorama Pre-Rules → Local Firewall Rules","C":"Panorama Shared Rules → Local Firewall Rules → Device Group Rules","D":"Local Firewall Rules → Panorama Pre-Rules → Panorama Post-Rules"},qZh:"安全政策 (Security policy) 規則庫 (rulebase) 的正確評估順序為何？",optsZh:{"A":"Panorama Pre-Rules → 本地防火牆規則 (Local Firewall Rules) → Panorama Post-Rules","B":"Panorama Post-Rules → Panorama Pre-Rules → 本地防火牆規則 (Local Firewall Rules)","C":"Panorama 共用規則 (Shared Rules) → 本地防火牆規則 (Local Firewall Rules) → 裝置群組規則 (Device Group Rules)","D":"本地防火牆規則 (Local Firewall Rules) → Panorama Pre-Rules → Panorama Post-Rules"}},
{n:68,ans:["C"],topic:"Service Route 更新",stem:"An administrator needs to ensure that a firewall can download threat prevention and software updates, but the management port is on an isolated network without internet access. Which service must be rerouted through a data plane interface using a service route to allow the firewall to download these updates?",opts:{"A":"External dynamic lists","B":"GlobalProtect Clientless VPN","C":"Palo Alto Networks Services","D":"Syslog"},qZh:"某管理員需要確保防火牆能下載威脅防護 (threat prevention) 與軟體更新，但管理連接埠 (management port) 位於一個無法存取網際網路的隔離網路上。哪個服務必須透過服務路由 (service route) 改走資料平面 (data plane) 介面，才能讓防火牆下載這些更新？",optsZh:{"A":"外部動態清單 (External dynamic lists)","B":"GlobalProtect Clientless VPN","C":"Palo Alto Networks Services","D":"Syslog"}},
{n:69,ans:["D"],topic:"Ansible IaC",stem:"An organization is adopting an Infrastructure as Code (IaC) approach to manage its entire network environment, including its Palo Alto Networks firewalls. The organization has chosen Ansible as its primary tool for this initiative. How does Ansible enable an IaC model for managing this organization's firewalls?",opts:{"A":"By providing real-time threat intelligence feeds directly to the firewalls' data plane","B":"By providing a graphical user interface that simplifies the creation of security policies through a drag-and-drop interface","C":"By automatically discovering and mapping all network devices to generate a baseline configuration","D":"By defining firewall configurations in playbooks that can be version-controlled and executed repeatedly"},qZh:"某組織正採用基礎架構即程式碼 (Infrastructure as Code, IaC) 的方式來管理其整個網路環境，包括 Palo Alto Networks 防火牆。該組織選擇 Ansible 作為此計畫的主要工具。Ansible 如何為該組織的防火牆實現 IaC 模式？",optsZh:{"A":"藉由直接向防火牆的資料平面 (data plane) 提供即時威脅情報饋送 (threat intelligence feeds)","B":"藉由提供圖形化使用者介面，透過拖放 (drag-and-drop) 介面簡化安全政策 (security policies) 的建立","C":"藉由自動探索並對應所有網路裝置以產生基準設定 (baseline configuration)","D":"藉由在 playbook 中定義防火牆設定，使其可進行版本控管並可重複執行"}},
{n:70,ans:["A"],topic:"AD 群組整合",stem:"A network security engineer wants to create Security policy rules that allow or deny traffic based on a user's department, which corresponds to groups in the company's Active Directory. To achieve this, the firewall needs to retrieve group information from the directory server. Which configuration object must be created first to establish the connection with the Active Directory server?",opts:{"A":"LDAP server profile","B":"User-ID agent service account","C":"Authentication sequence","D":"Kerberos server profile"},qZh:"某網路安全工程師想建立安全政策 (Security policy) 規則，根據使用者所屬的部門 (對應公司 Active Directory 中的群組) 來允許或拒絕流量。為達成此目的，防火牆需要從目錄伺服器擷取群組資訊。要建立與 Active Directory 伺服器的連線，必須先建立哪個設定物件？",optsZh:{"A":"LDAP 伺服器設定檔 (LDAP server profile)","B":"User-ID 代理程式服務帳戶 (User-ID agent service account)","C":"驗證序列 (Authentication sequence)","D":"Kerberos 伺服器設定檔 (Kerberos server profile)"}},
{n:71,ans:["D"],topic:"VSYS 資源限制",stem:"When an engineer creates a new VSYS on a supported firewall platform, which resource can be explicitly limited in the VSYS configuration to control its capacity?",opts:{"A":"Dedicated dataplane memory","B":"Maximum number of admin accounts","C":"Maximum number of log entries","D":"Maximum number of NAT rules"},qZh:"當工程師在支援的防火牆平台上建立新的 VSYS 時，VSYS 設定中可明確限制哪項資源以控制其容量？",optsZh:{"A":"專用資料平面記憶體 (Dedicated dataplane memory)","B":"管理員帳戶數量上限","C":"日誌項目 (log entries) 數量上限","D":"NAT 規則數量上限"}},
{n:72,ans:["A"],topic:"CIE 開發/生產隔離",stem:"A large organization has separate production and development environments, each with its own set of firewalls managed by Panorama. The organization uses Cloud Identity Engine (CIE) to consolidate user identities from Active Directory (AD) and Okta. A security mandate requires that development firewalls must only learn about \"DEV\" and \"QA\" user groups, while production firewalls should only see \"Prod\" user groups. How can an administrator enforce this separation using CIE with minimal complexity?",opts:{"A":"Create two segments, one with only \"DEV\" and \"QA\" groups, and one with \"Prod\" groups. Redistribute each segment to the corresponding group of firewalls.","B":"Redistribute all user and group information to all firewalls and use Panorama Device Group hierarchy to apply different Group Mapping profiles.","C":"Create filters using CLI commands to filter \"Prod,\" \"DEV,\" and \"QA\" groups.","D":"Configure two separate CIE instances, one for production and the other for development. Sync each instance to both AD and Okta."},qZh:"某大型組織具有彼此分開的生產 (production) 與開發 (development) 環境，各自有由 Panorama 管理的防火牆。該組織使用 Cloud Identity Engine (CIE) 來整合來自 Active Directory (AD) 與 Okta 的使用者身分。一項安全規定要求：開發環境的防火牆只能得知「DEV」與「QA」使用者群組，而生產環境的防火牆只能看到「Prod」使用者群組。管理員如何以最低的複雜度使用 CIE 來強制執行此分隔？",optsZh:{"A":"建立兩個區段 (segment)，一個只含「DEV」與「QA」群組，另一個含「Prod」群組。將每個區段分別重新分發 (redistribute) 給對應的防火牆群組。","B":"將所有使用者與群組資訊重新分發給所有防火牆，並使用 Panorama 裝置群組 (Device Group) 階層來套用不同的群組對應 (Group Mapping) 設定檔。","C":"使用 CLI 指令建立篩選器，以篩選「Prod」、「DEV」與「QA」群組。","D":"設定兩個獨立的 CIE 執行個體，一個用於生產、另一個用於開發。將每個執行個體同步至 AD 與 Okta 兩者。"}},
{n:73,ans:["B"],topic:"Panorama 可直接操作",stem:"An administrator must perform several actions on a fleet of firewalls from a central Panorama instance. To maintain efficiency, the administrator wants to only perform actions that do not require switching context into each firewall's individual web interface. Which set of actions is available to the administrator directly from the Panorama UI?",opts:{"A":"Creating a new VLAN — Assigning an interface to the new VLAN — Configuring a new DHCP server on the firewall","B":"Modifying a pre-rule — Editing a shared service object — Creating a new certificate profile","C":"Accessing the CLI — Restarting the device — Installing the latest content and software versions","D":"Configuring a new IPSec tunnel — Modifying the IKE gateway — Changing the DNS server settings of the firewall"},qZh:"某管理員必須從一個中央 Panorama 執行個體對一群防火牆執行多項操作。為維持效率，管理員只想執行那些不需要切換情境 (context switch) 進入每台防火牆個別網頁介面的操作。管理員可直接從 Panorama UI 執行哪一組操作？",optsZh:{"A":"建立新的 VLAN — 將介面指派至新 VLAN — 在防火牆上設定新的 DHCP 伺服器","B":"修改 pre-rule — 編輯共用 (shared) service 物件 — 建立新的憑證設定檔 (certificate profile)","C":"存取 CLI — 重新啟動裝置 — 安裝最新的內容 (content) 與軟體版本","D":"設定新的 IPSec 隧道 — 修改 IKE Gateway — 變更防火牆的 DNS 伺服器設定"}},
{n:74,ans:["B"],topic:"Q74",stem:"A network administrator is configuring an Aggregate Ethernet (AE) interface on an active/passive high availability (HA) pair. To reduce network downtime during a failover, the administrator wants the passive firewall's AE interface to be fully negotiated with the switch before it becomes active. Which Link Aggregation Control Protocol (LACP) setting achieves this administrator's goal?",opts:{"A":"LACP Mode active","B":"Enable in HA passive state","C":"System Priority: 1","D":"Transmission Rate: fast"},qZh:"某網路管理員正在一組主動/被動 (active/passive) 高可用性 (high availability, HA) 配對上設定聚合乙太網路 (Aggregate Ethernet, AE) 介面。為了在容錯移轉 (failover) 期間減少網路停機時間，管理員希望被動防火牆的 AE 介面在成為主動 (active) 之前就已與交換器完成完整協商。哪項鏈路聚合控制協定 (Link Aggregation Control Protocol, LACP) 設定可達成管理員的目標？",optsZh:{"A":"LACP 模式設為 active","B":"啟用「Enable in HA passive state」(在 HA 被動狀態下啟用)","C":"System Priority（系統優先序）：1","D":"Transmission Rate（傳輸速率）：fast"}},
{n:75,ans:["C"],topic:"Mgmt DHCP CLI",stem:"A firewall administrator needs to configure a new Palo Alto Networks firewall so that its management interface automatically obtains an IP address, netmask, and default gateway from the network. Which command should be executed in the CLI to accomplish this goal?",opts:{"A":"set deviceconfig system interface mgt mode dhcp","B":"set network interface management dhcp enable","C":"set deviceconfig system type dhcp-client","D":"configure system management-interface ip dynamic"},qZh:"某防火牆管理員需要設定一台新的 Palo Alto Networks 防火牆，使其管理介面 (management interface) 自動從網路取得 IP 位址、子網路遮罩 (netmask) 與預設閘道 (default gateway)。應在 CLI 中執行哪個指令以達成此目標？",optsZh:{"A":"set deviceconfig system interface mgt mode dhcp","B":"set network interface management dhcp enable","C":"set deviceconfig system type dhcp-client","D":"configure system management-interface ip dynamic"}},
{n:76,ans:["D"],topic:"Route 優先序",stem:"When multiple routes have the same destination prefix, which attribute does the firewall use first to determine route preference?",opts:{"A":"Administrative distance","B":"Route metric","C":"Next-hop availability","D":"Longest prefix match"},qZh:"當多條路由具有相同的目的地前綴 (destination prefix) 時，防火牆會優先使用哪個屬性來決定路由優先序 (route preference)？",optsZh:{"A":"管理距離 (Administrative distance)","B":"路由度量值 (Route metric)","C":"下一跳可用性 (Next-hop availability)","D":"最長前綴比對 (Longest prefix match)"}},
