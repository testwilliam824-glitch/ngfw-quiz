{n:77,multi:true,ans:["B","D"],topic:"AWS+Azure 集中安全",stem:"An organization must secure its AWS and Azure environments using a managed Palo Alto Networks solution, and all policies must be synchronized from an existing Panorama deployment. The organization wants to insert security with the least possible impact on its application teams and use existing hub-and-spoke network designs.\n- The AWS environment uses a centralized AWS Transit Gateway (TGW) architecture.\n- The Azure environment uses a Virtual WAN (vWAN) hub.\n\nWhich two actions are the most appropriate in this use case? (Choose two.)",opts:{"A":"Deploy Cloud NGFW endpoints in every application virtual private cloud (VPC), ignoring the TGW.","B":"Deploy Cloud NGFW into the vWAN hub as a trusted security partner, and update routing policies to secure traffic.","C":"Deploy individual VM-Series firewalls in each spoke virtual network (VNet) and manage them as a device group in Panorama.","D":"Deploy Cloud NGFW endpoints into a security virtual private cloud (VPC), and adjust the TGW route tables to inspect traffic flowing though the hub."},qZh:"某組織必須使用一套受管理的 Palo Alto Networks 解決方案來保護其 AWS 與 Azure 環境，且所有政策都必須從既有的 Panorama 部署同步。該組織希望以對其應用團隊影響最小的方式導入安全防護，並沿用既有的中心輻射 (hub-and-spoke) 網路設計。\n- AWS 環境使用集中式 AWS Transit Gateway (TGW) 架構。\n- Azure 環境使用 Virtual WAN (vWAN) hub。\n\n在此使用情境中，哪兩個動作最為適當？(請選擇兩項。)",optsZh:{"A":"在每個應用程式的虛擬私有雲 (virtual private cloud, VPC) 中部署 Cloud NGFW 端點，並忽略 TGW。","B":"將 Cloud NGFW 作為受信任的安全合作夥伴 (trusted security partner) 部署至 vWAN hub，並更新路由政策以保護流量。","C":"在每個輻射 (spoke) 虛擬網路 (virtual network, VNet) 中部署個別的 VM-Series 防火牆，並在 Panorama 中將其作為一個裝置群組 (device group) 管理。","D":"將 Cloud NGFW 端點部署至一個安全虛擬私有雲 (security VPC)，並調整 TGW 路由表以檢查流經 hub 的流量。"}},
{n:78,ans:["D"],topic:"Container NGFW",stem:"A cloud security team wants to extend its existing Palo Alto Networks Security policies into the organization's Kubernetes environments. The team requires an NGFW solution that can be deployed natively as a container and managed by Panorama. Which firewall form factor meets these requirements?",opts:{"A":"Cloud NGFW","B":"PA-5400 Series","C":"VM-Series","D":"CN-Series"},qZh:"某雲端安全團隊希望將其既有的 Palo Alto Networks 安全政策 (Security policies) 延伸至組織的 Kubernetes 環境。團隊需要一套可原生以容器 (container) 形式部署、並由 Panorama 管理的 NGFW 解決方案。哪種防火牆形態 (form factor) 符合這些需求？",optsZh:{"A":"Cloud NGFW","B":"PA-5400 系列","C":"VM-Series","D":"CN-Series"}},
{n:79,multi:true,ans:["B","C"],topic:"IPSec VPN Security Policy",stem:"A network architect is planning the deployment of a new IPSec VPN tunnel to connect a local data center to a cloud environment. The plan must include all necessary Security policy configurations for both tunnel negotiation and data transit. Which two Security policy requirements must be included in the implementation plan? (Choose two.)",opts:{"A":"A policy must explicitly permit the IPSec container application between the external-facing zone and local zone.","B":"A policy must explicitly permit only the IKE application between the external-facing zone and local zone.","C":"A pair of policies is required to control the flow of data traffic into and out of the security zone assigned to the tunnel interface.","D":"The default interzone-default security policy is sufficient to allow the tunnel negotiation traffic between the firewall and the remote peer."},qZh:"某網路架構師正在規劃部署一條新的 IPSec VPN 隧道，以連接本地資料中心與雲端環境。此規劃必須包含隧道協商 (tunnel negotiation) 與資料傳輸 (data transit) 兩者所需的所有安全政策 (Security policy) 設定。在實作計畫中必須包含哪兩項安全政策需求？(請選擇兩項。)",optsZh:{"A":"必須有一條政策明確允許 external-facing zone 與 local zone 之間的 IPSec 容器應用程式 (container application)。","B":"必須有一條政策明確只允許 external-facing zone 與 local zone 之間的 IKE 應用程式。","C":"需要一對政策來控制資料流量進出指派給 tunnel 介面之安全區域 (security zone) 的流向。","D":"預設的 interzone-default 安全政策即足以允許防火牆與遠端對等端 (remote peer) 之間的隧道協商流量。"}},
{n:80,ans:["A"],topic:"Inter-VSYS Zone",stem:"A network security engineer needs to permit traffic between two distinct VSYS that reside on one Palo Alto Networks firewall. This traffic will not egress the firewall to an external device. Which zone type must be configured to act as the logical source and destination for this traffic flow?",opts:{"A":"External","B":"TAP","C":"Layer 3","D":"Layer 2"},qZh:"某網路安全工程師需要允許位於同一台 Palo Alto Networks 防火牆上的兩個不同 VSYS 之間的流量。此流量不會從防火牆出向 (egress) 至外部裝置。必須設定哪種 zone 類型來作為此流量的邏輯來源與目的地？",optsZh:{"A":"External","B":"TAP","C":"Layer 3","D":"Layer 2"}},
{n:81,ans:["C"],topic:"Virtual Wire 速度",stem:"What is the requirement for interface link speeds when configuring a virtual wire on a Palo Alto Networks firewall?",opts:{"A":"They must be configured with auto-negotiate settings regardless of the port type.","B":"They must all be either copper or fiber optic, however they can be different.","C":"They must have the same link speed and transmission mode.","D":"They must be the same media type."},qZh:"在 Palo Alto Networks 防火牆上設定 virtual wire 時，對介面連線速度 (link speed) 的要求為何？",optsZh:{"A":"無論連接埠類型為何，介面都必須設定為自動協商 (auto-negotiate)。","B":"所有介面必須同為銅纜或同為光纖，但它們可以不同。","C":"介面必須具有相同的連線速度 (link speed) 與傳輸模式 (transmission mode)。","D":"介面必須是相同的媒介類型 (media type)。"}},
{n:82,ans:["A"],topic:"L3-only Service",stem:"When configuring a physical interface on a Palo Alto Networks firewall, which IP-based service is only available if the interface is set to Layer 3 mode?",opts:{"A":"DDNS client","B":"NetFlow export","C":"QoS","D":"Link monitoring"},qZh:"在 Palo Alto Networks 防火牆上設定實體介面時，哪一項基於 IP 的服務只有在介面設定為 Layer 3 模式時才可使用？",optsZh:{"A":"DDNS 用戶端 (DDNS client)","B":"NetFlow 匯出 (NetFlow export)","C":"QoS","D":"連線監控 (Link monitoring)"}},
{n:83,ans:["B"],topic:"Preemptive Hold 0",stem:"A network engineer observes that after a primary link recovers, the firewall immediately switches traffic back from the backup static route to the primary static route. The engineer checks the path monitoring configuration for the primary route. Which value is configured for the preemptive hold time to cause this behavior?",opts:{"A":"Lowest possible value greater than 0","B":"0","C":"Default value","D":"Feature disabled"},qZh:"某網路工程師發現，在主要鏈路 (primary link) 恢復後，防火牆立即將流量從備援靜態路由 (backup static route) 切回主要靜態路由 (primary static route)。該工程師檢查了主要路由的路徑監控 (path monitoring) 設定。是哪一個 preemptive hold time 值的設定造成此行為？",optsZh:{"A":"大於 0 的最低可能值","B":"0","C":"預設值","D":"功能已停用"}},
{n:84,ans:["D"],topic:"Link Group 介面",stem:"A Palo Alto Networks firewall has the following interfaces configured:\n- ethernet1/1 (Layer 3)\n- ethernet1/2 (TAP)\n- ethernet1/3 (Layer 2)\n- ethernet1/4 (virtual wire)\n\nAn administrator needs to create a link group to monitor upstream connectivity for high availability (HA) failover. Which set of interfaces can be added to the link group?",opts:{"A":"ethernet1/1, ethernet1/2, ethernet1/4","B":"ethernet1/1, ethernet1/2, ethernet1/3","C":"ethernet1/2, ethernet1/3, ethernet1/4","D":"ethernet1/1, ethernet1/3, ethernet1/4"},qZh:"某 Palo Alto Networks 防火牆設定了以下介面：\n- ethernet1/1 (Layer 3)\n- ethernet1/2 (TAP)\n- ethernet1/3 (Layer 2)\n- ethernet1/4 (virtual wire)\n\n管理員需要建立一個 link group，以監控用於高可用性 (high availability, HA) 容錯移轉 (failover) 的上游連線。哪一組介面可以加入此 link group？",optsZh:{"A":"ethernet1/1、ethernet1/2、ethernet1/4","B":"ethernet1/1、ethernet1/2、ethernet1/3","C":"ethernet1/2、ethernet1/3、ethernet1/4","D":"ethernet1/1、ethernet1/3、ethernet1/4"}},
{n:85,ans:["B"],topic:"OCSP vs CRL",stem:"An administrator is designing a public key infrastructure (PKI) integration for a large-scale deployment with thousands of users authenticating via client certificates. A key design goal is to ensure that certificate revocation status is checked efficiently with minimal impact on firewall performance and minimal delay for the connecting user. What is the primary advantage of using the Online Certificate Status Protocol (OCSP) instead of certificate revocation lists (CRLs) in this scenario?",opts:{"A":"OCSP allows the firewall to act as its own certificate authority (CA), and it simplifies certificate management.","B":"OCSP provides real-time status for a certificate on demand, is more scalable, and uses less firewall memory.","C":"OCSP is an older, more widely supported protocol than CRLs, ensuring compatibility with all client devices.","D":"OCSP bundles all certificate statuses into a single, digitally signed file for faster downloads by the firewall."},qZh:"某管理員正在為一個大規模部署設計公開金鑰基礎架構 (public key infrastructure, PKI) 整合，該部署有數千名使用者透過用戶端憑證 (client certificate) 進行驗證。一個關鍵的設計目標是確保有效率地檢查憑證撤銷狀態 (certificate revocation status)，並將對防火牆效能的影響及連線使用者的延遲降至最低。在此情境中，使用線上憑證狀態協定 (Online Certificate Status Protocol, OCSP) 而非憑證撤銷清單 (certificate revocation lists, CRLs) 的主要優勢為何？",optsZh:{"A":"OCSP 允許防火牆充當其自身的憑證授權單位 (certificate authority, CA)，並簡化憑證管理。","B":"OCSP 可依需求即時提供單一憑證的狀態，擴展性更佳，且使用較少的防火牆記憶體。","C":"OCSP 是比 CRL 更舊、更廣泛支援的協定，可確保與所有用戶端裝置的相容性。","D":"OCSP 將所有憑證狀態彙整為單一、經數位簽章的檔案，以供防火牆更快下載。"}},
{n:86,ans:["C"],topic:"AWS 自動擴展",stem:"An organization is migrating its data center to Amazon Web Services (AWS) and needs to deploy VM-Series firewalls to inspect all ingress and egress traffic. The solution must provide both resilience across multiple Availability Zones and the ability to scale horizontally. Which combination of AWS services and Palo Alto Networks components is required for this use case?",opts:{"A":"AWS Lambda function that monitors the firewall's health and re-routes traffic using the AWS API","B":"PAN-OS active/active high availability (HA) pair with an AWS Transit Gateway","C":"Amazon EC2 Auto Scaling group with VM-Series firewalls and an Amazon Gateway Load Balancer","D":"Single VM-Series firewall with an Elastic IP address that can be re-associated upon failure"},qZh:"某組織正將其資料中心遷移至 Amazon Web Services (AWS)，並需要部署 VM-Series 防火牆來檢測所有進站 (ingress) 與出站 (egress) 流量。該解決方案必須同時提供跨多個可用區域 (Availability Zones) 的韌性，以及水平擴展 (scale horizontally) 的能力。此使用案例需要哪一組 AWS 服務與 Palo Alto Networks 元件的組合？",optsZh:{"A":"使用 AWS Lambda 函式監控防火牆的健康狀態，並透過 AWS API 重新導向流量","B":"PAN-OS active/active 高可用性 (high availability, HA) 配對搭配 AWS Transit Gateway","C":"Amazon EC2 Auto Scaling 群組搭配 VM-Series 防火牆與 Amazon Gateway Load Balancer","D":"單一具有彈性 IP 位址 (Elastic IP address) 的 VM-Series 防火牆，可在故障時重新關聯"}},
{n:87,multi:true,ans:["A","D"],topic:"SSL/TLS Profile 套用",stem:"Which two services are configured by applying an SSL/TLS service profile? (Choose two.)",opts:{"A":"Global Protect portal","B":"Log forwarding to Strata Logging Service","C":"Forward-Trust certificate","D":"Syslog server monitoring"},qZh:"套用 SSL/TLS service profile 可設定哪兩種服務？(請選兩項。)",optsZh:{"A":"GlobalProtect portal","B":"轉發日誌至 Strata Logging Service","C":"Forward-Trust 憑證","D":"Syslog 伺服器監控 (Syslog server monitoring)"}},
{n:88,ans:["B"],topic:"On-prem Log 消失",stem:"A firewall administrator uses Panorama to manage a fleet of firewalls. After successfully onboarding the firewalls to Strata Logging Service and enabling cloud logging via a template, the security operations team reports that they can no longer see new logs on the on-premises Panorama log collectors. Logs are appearing correctly in Strata Logging Service. Which setting was likely missed in the Panorama template configuration?",opts:{"A":"The device certificates for the Panorama log collectors were not renewed after enabling the cloud logging connection.","B":"Duplicate logging (cloud and on-premises) is disabled under Device → Setup → Management.","C":"The Log Forwarding profile was modified to send logs only to the Strata Logging Service and no longer includes the on-premises Panorama log collectors.","D":"The Panorama log collectors were not defined as primary destinations within the collector group configuration for the managed firewalls."},qZh:"某防火牆管理員使用 Panorama 管理一組防火牆。在成功將這些防火牆上線 (onboard) 至 Strata Logging Service 並透過範本 (template) 啟用雲端日誌記錄 (cloud logging) 後，資安維運團隊回報他們無法再於本地端 (on-premises) 的 Panorama 日誌收集器 (log collectors) 上看到新的日誌。日誌在 Strata Logging Service 中正確顯示。在 Panorama 範本設定中，可能遺漏了哪一項設定？",optsZh:{"A":"在啟用雲端日誌記錄連線後，未更新 Panorama 日誌收集器的裝置憑證 (device certificates)。","B":"在 Device → Setup → Management 下，重複日誌記錄 (Duplicate logging，雲端與本地端) 已停用。","C":"Log Forwarding profile 被修改為僅將日誌傳送至 Strata Logging Service，不再包含本地端的 Panorama 日誌收集器。","D":"在受管理防火牆的收集器群組 (collector group) 設定中，未將 Panorama 日誌收集器定義為主要目的地。"}},
{n:89,ans:["B"],topic:"VSYS 資源配額",stem:"What is a valid configurable limit for setting resource quotas when defining a new VSYS on a Palo Alto Networks firewall?",opts:{"A":"Percentage of total CPU utilization","B":"Maximum number of SSL decryption rules","C":"Maximum number of virtual routers","D":"Disk space allocation for logs"},qZh:"在 Palo Alto Networks 防火牆上定義新的 VSYS 時，設定資源配額 (resource quotas) 的有效可設定限制為何？",optsZh:{"A":"總 CPU 使用率百分比","B":"SSL decryption 規則的最大數量","C":"virtual routers 的最大數量","D":"日誌的磁碟空間配置"}},
{n:90,ans:["D"],topic:"最準確 User-ID",stem:"When considering the various methods for User-ID to learn user-to-IP address mappings, which source is considered the most accurate due to the mapping being explicitly created through an authentication event directly with the firewall?",opts:{"A":"X-Forwarded-For (XFF) headers","B":"Server monitoring","C":"GlobalProtect","D":"Authentication Portal"},qZh:"在考量 User-ID 用以學習使用者對 IP 位址對應 (user-to-IP address mappings) 的各種方法時，由於該對應是透過直接與防火牆進行的驗證事件 (authentication event) 明確建立的，因此哪一個來源被視為最準確？",optsZh:{"A":"X-Forwarded-For (XFF) 標頭","B":"伺服器監控 (Server monitoring)","C":"GlobalProtect","D":"驗證入口網站 (Authentication Portal)"}},
{n:91,ans:["C"],topic:"LACP 收斂延遲",stem:"After a recent high availability (HA) failover test on an active/passive cluster, an engineer noted a 30-45 second delay before traffic started flowing through a Link Aggregation Control Protocol (LACP) aggregate interface on the newly active firewall. What should have been configured to support LACP pre-negotiation to minimize LACP convergence delay?",opts:{"A":"Enable LACP fast failover.","B":"Set LACP mode to passive.","C":"Enable in HA passive state.","D":"Set HA link monitoring to aggressive."},qZh:"在某 active/passive 叢集上進行最近一次高可用性 (high availability, HA) 容錯移轉 (failover) 測試後，某工程師注意到在新成為作用中 (active) 的防火牆上，流量開始通過鏈路聚合控制協定 (Link Aggregation Control Protocol, LACP) 聚合介面 (aggregate interface) 之前，有 30 至 45 秒的延遲。應該設定什麼以支援 LACP 預先協商 (pre-negotiation)，藉此將 LACP 收斂延遲 (convergence delay) 降至最低？",optsZh:{"A":"啟用 LACP 快速容錯移轉 (fast failover)。","B":"將 LACP 模式設定為 passive。","C":"啟用「Enable in HA Passive State」。","D":"將 HA 連線監控 (link monitoring) 設定為 aggressive。"}},
{n:92,ans:["B"],topic:"Terraform vs Ansible 工作流",stem:"An engineer is creating an automation workflow. The first step is to deploy a new VM-Series firewall into a VMware vSphere environment, including its virtual machine (VM) configuration and network interfaces. The second step is to connect to the firewall and configure a complex set of Security policies and objects. The team uses both Terraform and Ansible. For which part of this workflow would Terraform typically be used?",opts:{"A":"Pushing threat intelligence updates to the new firewall","B":"Deploying the VM and associated network interfaces","C":"Storing the credentials needed to access the vSphere environment","D":"Applying the detailed Security policies and objects"},qZh:"某工程師正在建立一套自動化工作流程。第一步是將新的 VM-Series 防火牆部署至 VMware vSphere 環境中，包含其虛擬機器 (virtual machine, VM) 設定與網路介面。第二步是連線至該防火牆，並設定一組複雜的安全政策 (Security policies) 與物件 (objects)。該團隊同時使用 Terraform 與 Ansible。在此工作流程中，Terraform 通常會用於哪一部分？",optsZh:{"A":"將威脅情報 (threat intelligence) 更新推送至新防火牆","B":"部署 VM 與相關聯的網路介面","C":"儲存存取 vSphere 環境所需的憑證 (credentials)","D":"套用詳細的安全政策 (Security policies) 與物件"}},
{n:93,ans:["B"],topic:"CIE Segments",stem:"An organization uses Cloud Identity Engine (CIE) to gather user information from its on-premises Active Directory (AD) for employees and a separate Azure AD for external partners. Due to compliance regulations, the firewalls protecting the internal network must not have any identity information about external partners. Conversely, firewalls in the partner-facing DMZ should only be aware of partner identities. Which CIE feature is designed to solve this data partitioning requirement?",opts:{"A":"Panorama templates, which can be used to push different User-ID agent configurations to each firewall group","B":"Segments, which can be configured to create distinct, filter-based views of users and groups that are then redistributed only to the appropriate firewalls","C":"Multiple tenants, where a separate CIE tenant is required for each user directory to maintain isolation","D":"Directory sync filtering, which is used at the source to prevent specific OUs from being imported into CIE"},qZh:"某組織使用 Cloud Identity Engine (CIE) 從其本地端 Active Directory (AD) 收集員工的使用者資訊，並從另一個獨立的 Azure AD 收集外部合作夥伴的資訊。由於合規法規要求，保護內部網路的防火牆不得擁有任何關於外部合作夥伴的身份資訊。反之，面向合作夥伴的 DMZ 中的防火牆則應僅知悉合作夥伴的身份。CIE 的哪一項功能是為了解決此資料分割 (data partitioning) 需求而設計的？",optsZh:{"A":"Panorama 範本 (templates)，可用於將不同的 User-ID agent 設定推送至各防火牆群組","B":"區段 (Segments)，可設定以建立基於篩選器 (filter-based) 的使用者與群組明確檢視，然後僅重新分發 (redistribute) 給適當的防火牆","C":"多租戶 (Multiple tenants)，每個使用者目錄需要一個獨立的 CIE 租戶以維持隔離","D":"目錄同步篩選 (Directory sync filtering)，用於在來源端防止特定 OU 被匯入 CIE"}},
{n:94,multi:true,ans:["A","B"],topic:"Zone 類型",stem:"What are two valid zone types that can be selected from the zone configuration menu, per Palo Alto Networks best practices? (Choose two.)",opts:{"A":"Layer 3","B":"Layer 2","C":"Management","D":"DMZ"},qZh:"依據 Palo Alto Networks 最佳實踐，在 zone 設定選單中可選取哪兩種有效的 zone 類型？(請選兩項。)",optsZh:{"A":"Layer 3","B":"Layer 2","C":"Management","D":"DMZ"}},
{n:95,ans:["D"],topic:"醫院 Content Update",stem:"An administrator is configuring dynamic updates on a Palo Alto Networks firewall that protects a hospital's patient record system. The primary concern is ensuring maximum stability and avoiding any service disruption from a potentially problematic content update. To align with Palo Alto Networks best practices for such environments, which threshold should the administrator set for content updates?",opts:{"A":"0 hours","B":"12 hours","C":"24 hours","D":"48 hours"},qZh:"某管理員正在保護某醫院病歷系統的 Palo Alto Networks 防火牆上設定動態更新 (dynamic updates)。主要考量是確保最大穩定性，並避免因可能有問題的內容更新 (content update) 而造成任何服務中斷。為符合 Palo Alto Networks 針對此類環境的最佳實踐，管理員應為內容更新設定哪一個門檻值 (threshold)？",optsZh:{"A":"0 小時","B":"12 小時","C":"24 小時","D":"48 小時"}},
{n:96,ans:["A"],topic:"Split DNS 效果",stem:"An engineer is configuring a GlobalProtect portal and wants to enable split tunneling. The requirement is to route DNS queries for \"https://www.google.com/search?q=corp.internal.com\" to the DNS servers assigned by the VPN, while allowing all other DNS queries to be resolved by the client's locally configured DNS. What is the effect of configuring this split DNS policy?",opts:{"A":"It provides selective DNS resolution, with specified domains resolved through the tunnel, optimizing performance for other lookups.","B":"It blocks access to all domains that are not explicitly listed in the split tunnel configuration.","C":"It forces all applications to use the corporate DNS servers, regardless of the split tunnel settings for IP traffic.","D":"It creates a DNS proxy on the client endpoint that forwards all queries to the firewall for inspection."},qZh:"某工程師正在設定 GlobalProtect portal 並想啟用分割通道 (split tunneling)。其需求是將針對「https://www.google.com/search?q=corp.internal.com」的 DNS 查詢導向至 VPN 所指派的 DNS 伺服器，同時允許所有其他 DNS 查詢由用戶端本地設定的 DNS 解析。設定此分割 DNS (split DNS) 政策的效果為何？",optsZh:{"A":"它提供選擇性的 DNS 解析，指定的網域透過通道 (tunnel) 解析，同時為其他查詢最佳化效能。","B":"它封鎖對所有未在分割通道設定中明確列出的網域之存取。","C":"它強制所有應用程式使用企業 DNS 伺服器，而不論針對 IP 流量的分割通道設定為何。","D":"它在用戶端端點上建立一個 DNS proxy，將所有查詢轉發至防火牆進行檢測。"}},
{n:97,ans:["C"],topic:"SD-WAN Path Quality API",stem:"An automation engineer is developing a Python script to standardize SD-WAN deployments across multiple customer tenants in Panorama. A key requirement is to programmatically create path quality profiles to monitor link performance based on latency, jitter, and packet loss. Which API call is required for this task?",opts:{"A":"XML API command with an xpath of config/devices/entry/vsys/entry/path-quality-profiles on Panorama","B":"XML API command with an xpath of sdwan/path-quality-profiles on a managed firewall","C":"POST request to the SDWanPathQualityProfiles object endpoint via the REST API on Panorama","D":"POST request to the pathMonitoringProfiles object endpoint via the REST API on a managed firewall"},qZh:"一位自動化工程師正在開發一支 Python 腳本，用於在 Panorama 中跨多個客戶租戶 (tenant) 標準化 SD-WAN 部署。一項關鍵需求是以程式化方式建立路徑品質設定檔 (path quality profile)，以根據延遲 (latency)、抖動 (jitter) 和封包遺失 (packet loss) 監控連結效能。此任務需要使用哪個 API 呼叫？",optsZh:{"A":"在 Panorama 上使用 XML API 指令，xpath 為 config/devices/entry/vsys/entry/path-quality-profiles","B":"在受管防火牆 (managed firewall) 上使用 XML API 指令，xpath 為 sdwan/path-quality-profiles","C":"在 Panorama 上透過 REST API 對 SDWanPathQualityProfiles 物件端點 (endpoint) 發出 POST 請求","D":"在受管防火牆 (managed firewall) 上透過 REST API 對 pathMonitoringProfiles 物件端點 (endpoint) 發出 POST 請求"}},
{n:98,ans:["A"],topic:"Custom Report Database",stem:"A security administrator is creating a new custom report to get a consolidated view of network events and needs to select a database to query for the report data. Which valid set of databases is available for the task?",opts:{"A":"Threat, URL Filtering, WildFire Submissions, GlobalProtect","B":"Traffic, User-ID, Application Statistics, HIP Match","C":"Data Filtering, IP-Tag, User-ID, Endpoint Security","D":"System, Config, Authentication, Session Flow"},qZh:"一位安全管理員正在建立一份新的自訂報表 (custom report)，以取得網路事件的整合檢視，並需要選擇一個資料庫來查詢報表資料。哪一組有效的資料庫可供此任務使用？",optsZh:{"A":"Threat（威脅）、URL Filtering（URL 過濾）、WildFire Submissions（WildFire 提交）、GlobalProtect","B":"Traffic（流量）、User-ID、Application Statistics（應用程式統計）、HIP Match","C":"Data Filtering（資料過濾）、IP-Tag、User-ID、Endpoint Security（端點安全）","D":"System（系統）、Config（設定）、Authentication（認證）、Session Flow（連線流）"}},
{n:99,ans:["B"],topic:"Explicit Proxy",stem:"An organization's Security policy states that for all outbound web traffic, the TCP session to the external web server must be established by the firewall, not the user's workstation. This requires configuring user web browsers to point to the firewall. Authentication is also required. Which solution on a PA-Series firewall meets these specific needs?",opts:{"A":"Transparent proxy","B":"Explicit proxy","C":"GlobalProtect with User-ID","D":"Decryption policy with Authentication Portal"},qZh:"某組織的安全政策 (Security policy) 規定，對於所有對外的 Web 流量，與外部 Web 伺服器之間的 TCP 連線必須由防火牆建立，而非使用者的工作站。這需要設定使用者的 Web 瀏覽器指向防火牆。同時也需要進行認證。PA-Series 防火牆上的哪個解決方案能滿足這些特定需求？",optsZh:{"A":"透明代理 (Transparent proxy)","B":"顯式代理 (Explicit proxy)","C":"搭配 User-ID 的 GlobalProtect","D":"搭配 Authentication Portal 的解密政策 (Decryption policy)"}},
{n:100,ans:["C"],topic:"Proxy ID 新子網",stem:"An administrator is troubleshooting a newly configured site-to-site VPN between a PAN-OS firewall and a third-party policy-based VPN gateway. The tunnel allows traffic between the first pair of configured subnets, but traffic to a newly added remote subnet is failing. The administrator has confirmed that routing and Security policies are correct. What is the most likely cause of this issue?",opts:{"A":"A static route for the new subnet pointing to the tunnel interface is missing.","B":"The Security policy for the new subnet must be placed above the existing VPN policy.","C":"The new local and remote subnets are missing from the Proxy ID configuration.","D":"The tunnel's maximum transmission unit (MTU) size must be increased to accommodate the new traffic."},qZh:"一位管理員正在對一條新設定的站對站 (site-to-site) VPN 進行疑難排解，該 VPN 建立於一台 PAN-OS 防火牆與一台第三方基於政策 (policy-based) 的 VPN 閘道之間。該隧道允許第一組已設定的子網路之間的流量，但前往新增遠端子網路的流量卻失敗。管理員已確認路由與安全政策 (Security policy) 皆正確。此問題最可能的原因為何？",optsZh:{"A":"缺少一條指向隧道介面 (tunnel interface) 的新子網路靜態路由。","B":"新子網路的安全政策 (Security policy) 必須置於現有 VPN 政策之上。","C":"新的本地與遠端子網路未加入 Proxy ID 設定中。","D":"必須增加隧道的最大傳輸單元 (MTU) 大小以容納新流量。"}},
{n:101,ans:["D"],topic:"GP Pre-logon + SAML",stem:"An organization needs a GlobalProtect solution that meets two key requirements:\n- IT administrators must be able to run scripts and push updates to endpoints before a user logs in.\n- Users must authenticate with their cloud identity provider, which is protected by multi-factor authentication (MFA).\n\nWhich GlobalProtect authentication configuration should be used to meet both requirements?",opts:{"A":"Cookie-based authentication for both pre-logon and user logon.","B":"SAML authentication for pre-logon and certificate-based authentication for user logon.","C":"Single authentication profile using Kerberos to handle both pre-logon and user logon.","D":"Certificate-based authentication for pre-logon and SAML authentication for user logon."},qZh:"某組織需要一套滿足兩項關鍵需求的 GlobalProtect 解決方案：\n- IT 管理員必須能在使用者登入之前對端點執行腳本並推送更新。\n- 使用者必須以其受多因素認證 (MFA) 保護的雲端身分識別提供者 (identity provider) 進行認證。\n\n應採用哪種 GlobalProtect 認證設定以同時滿足這兩項需求？",optsZh:{"A":"對 pre-logon 與使用者登入皆採用基於 Cookie 的認證。","B":"對 pre-logon 採用 SAML 認證，對使用者登入採用基於憑證 (certificate-based) 的認證。","C":"使用單一認證設定檔 (authentication profile)，以 Kerberos 同時處理 pre-logon 與使用者登入。","D":"對 pre-logon 採用基於憑證 (certificate-based) 的認證，對使用者登入採用 SAML 認證。"}},
{n:102,ans:["D"],topic:"CN-Series 用途",stem:"What is the primary use case for the CN-Series NGFW?",opts:{"A":"Protecting mobile users and remote branch offices (east-west)","B":"Providing security for physical data center perimeters (north-south)","C":"Securing traffic in and out of a public cloud VPC or VNet (north-south)","D":"Enforcing Security policies between pods in a Kubernetes environment (east-west)"},qZh:"CN-Series NGFW 的主要使用情境為何？",optsZh:{"A":"保護行動使用者與遠端分公司（東西向，east-west）","B":"為實體資料中心邊界提供安全防護（南北向，north-south）","C":"保護進出公有雲 VPC 或 VNet 的流量（南北向，north-south）","D":"在 Kubernetes 環境中於 pod 之間強制執行安全政策 (Security policy)（東西向，east-west）"}},
{n:103,ans:["D"],topic:"OCSP 驗證物件",stem:"After a recent security audit, a company is required to enforce more strict validation for all certificate-based authentication, including for GlobalProtect clients. An engineer observes the firewall accepting certificates from a recently compromised intermediate certificate authority (CA). The engineer needs to update the firewall configuration to use an Online Certificate Status Protocol (OCSP) responder to check for revoked certificates in real time. In which configuration object would the engineer enable OCSP verification for the CAs used in the authentication process?",opts:{"A":"Authentication sequence","B":"Decryption profile","C":"SSL/TLS service profile","D":"Certificate profile"},qZh:"在最近一次安全稽核後，某公司被要求對所有基於憑證 (certificate-based) 的認證（包括 GlobalProtect 用戶端）強制執行更嚴格的驗證。一位工程師觀察到防火牆接受了來自一個近期遭入侵的中繼憑證授權單位 (intermediate CA) 的憑證。該工程師需要更新防火牆設定，以使用線上憑證狀態協定 (OCSP) 回應者即時檢查已撤銷的憑證。工程師應在哪個設定物件中為認證流程所用的 CA 啟用 OCSP 驗證？",optsZh:{"A":"認證序列 (Authentication sequence)","B":"解密設定檔 (Decryption profile)","C":"SSL/TLS 服務設定檔 (SSL/TLS service profile)","D":"憑證設定檔 (Certificate profile)"}},
{n:104,ans:["D"],topic:"SSL FP 憑證錯誤",stem:"An administrator enables SSL Forward Proxy decryption using a self-signed certificate on a Palo Alto Networks firewall as the forward trust certificate. Shortly after, users report receiving \"Your connection is not private\" browser errors for all external websites. What is the most likely cause of these widespread certificate errors?",opts:{"A":"The decryption policy is configured with a \"no-decrypt\" action, which causes browsers to reject the connection.","B":"The external websites are using TLS 1.3, which cannot be decrypted by the firewall without a specific license.","C":"The firewall's forward untrust certificate has expired, preventing it from identifying untrusted sites.","D":"The firewall's self-signed CA certificate is not deployed to the trusted certificate store on client endpoints."},qZh:"一位管理員在 Palo Alto Networks 防火牆上以自簽憑證作為 forward trust 憑證啟用了 SSL Forward Proxy 解密。不久後，使用者回報所有外部網站皆出現「您的連線不是私人連線 (Your connection is not private)」的瀏覽器錯誤。這些普遍性憑證錯誤最可能的原因為何？",optsZh:{"A":"解密政策 (Decryption policy) 設定為「no-decrypt（不解密）」動作，導致瀏覽器拒絕連線。","B":"外部網站使用 TLS 1.3，防火牆若無特定授權即無法解密。","C":"防火牆的 forward untrust 憑證已過期，導致無法識別不受信任的網站。","D":"防火牆的自簽 CA 憑證未部署到用戶端端點的受信任憑證儲存區 (trusted certificate store)。"}},
{n:105,multi:true,ans:["A","C"],topic:"IPSec Security Rules",stem:"An engineer is configuring a site-to-site IPSec VPN to a partner network. The IKE Gateway and IPSec tunnel configurations are complete, and the tunnel interface has been assigned to a security zone. However, the tunnel fails to establish, and no application traffic passes through it once it is up. Which two Security policy configurations are required to allow tunnel establishment and data traffic flow in this scenario? (Choose two.)",opts:{"A":"A security rule is needed to allow IKE and IPSec traffic between the zone where the physical interface resides and the zone of the partner gateway.","B":"A single bidirectional security rule must be configured to manage traffic flowing through the tunnel interface.","C":"Security rules must be configured to permit application traffic from the local zone to the tunnel zone, and from the tunnel zone to the local zone.","D":"An Application Override policy is needed to allow both the IKE negotiation and the encapsulated data traffic."},qZh:"一位工程師正在設定一條連往合作夥伴網路的站對站 (site-to-site) IPSec VPN。IKE Gateway 與 IPSec 隧道設定皆已完成，且隧道介面 (tunnel interface) 已指派至一個安全區域 (security zone)。然而，隧道無法建立，且在隧道建立後也沒有任何應用程式流量能通過。在此情境下，需要哪兩項安全政策 (Security policy) 設定才能允許隧道建立與資料流量通行？（選兩項）",optsZh:{"A":"需要一條安全規則，以允許實體介面所在區域 (zone) 與合作夥伴閘道區域之間的 IKE 與 IPSec 流量。","B":"必須設定一條單一的雙向安全規則，以管理通過隧道介面 (tunnel interface) 的流量。","C":"必須設定安全規則，以允許從本地區域到隧道區域 (tunnel zone)、以及從隧道區域到本地區域的應用程式流量。","D":"需要一條應用程式覆寫 (Application Override) 政策，以同時允許 IKE 協商與封裝後的資料流量。"}},
{n:106,ans:["B"],topic:"Preemptive Hold 0 失效切回",stem:"A network administrator is configuring path monitoring for a primary static route to ensure immediate failback from a backup route. The administrator wants the primary route to become active again without any delay as soon as its path is restored. Which preemptive hold time value should the administrator configure to achieve this immediate failback?",opts:{"A":"-1","B":"0","C":"1","D":"2"},qZh:"一位網路管理員正在為一條主要靜態路由設定路徑監控 (path monitoring)，以確保從備援路由立即切回 (failback)。該管理員希望主要路由在其路徑恢復時立即重新生效，且無任何延遲。管理員應設定哪個 preemptive hold time 值以達成此立即切回？",optsZh:{"A":"-1","B":"0","C":"1","D":"2"}},
{n:107,ans:["C"],topic:"GCP HA 架構",stem:"A network security engineer is designing a resilient architecture for inspecting traffic in Google Cloud Platform (GCP). The design must ensure that firewall service is maintained even if a single GCP zone becomes unavailable. Which architecture should be used for the VM-Series firewalls in this use case?",opts:{"A":"Ansible playbook that monitors the health of the primary firewall and launches a new one in a different zone when a failure is detected","B":"Single, large VM-Series firewall in one zone that is configured for live migration to another zone upon failure","C":"Instance group of VM-Series firewalls spread across multiple zones with traffic routed to them by a GCP Internal Load Balancer","D":"PAN-OS active/active high availability (HA) cluster configured with dedicated HA interfaces in a shared VPC"},qZh:"一位網路安全工程師正在為 Google Cloud Platform (GCP) 中的流量檢測設計具韌性的架構。該設計必須確保即使單一 GCP 區域 (zone) 變得無法使用，防火牆服務仍能維持。在此使用情境中，VM-Series 防火牆應採用哪種架構？",optsZh:{"A":"使用 Ansible playbook 監控主要防火牆的健康狀態，並在偵測到故障時於不同區域 (zone) 啟動一台新的防火牆","B":"在單一區域 (zone) 中使用一台大型 VM-Series 防火牆，並設定為在故障時即時遷移 (live migration) 至另一區域","C":"由跨多個區域 (zone) 分佈的 VM-Series 防火牆組成執行個體群組 (instance group)，並由 GCP 內部負載平衡器 (Internal Load Balancer) 將流量路由至這些防火牆","D":"在共用 VPC 中設定具有專用 HA 介面的 PAN-OS active/active 高可用性 (HA) 叢集"}},
{n:108,ans:["B"],topic:"L2 Zone 通訊",stem:"An engineer configures a PA-440 firewall to act as a switch by creating several Layer 2 interfaces and assigning them all to VLAN 20. A file server is connected to interface ethernet1/1, and client workstations are connected to interfaces ethernet1/2 and ethernet1/3. All devices are in VLAN 20. The clients are unable to access the file server. Which configuration step to allow this communication by default is missing?",opts:{"A":"Create an Aggregate Ethernet (AE) group that includes all three interfaces.","B":"Place ethernet1/1, ethernet1/2, and ethernet1/3 into the same Layer 2 zone.","C":"Create an \"allow\" Security policy with the source and destination VLAN set to \"VLAN 20\".","D":"Create a Layer 3 subinterface for VLAN 20 to enable routing."},qZh:"一位工程師將一台 PA-440 防火牆設定為交換器運作，方式是建立數個 Layer 2 介面並將它們全部指派至 VLAN 20。一台檔案伺服器連接至介面 ethernet1/1，而用戶端工作站連接至介面 ethernet1/2 與 ethernet1/3。所有裝置皆位於 VLAN 20。用戶端無法存取檔案伺服器。缺少哪個設定步驟才能在預設情況下允許此通訊？",optsZh:{"A":"建立一個包含全部三個介面的聚合乙太網路 (Aggregate Ethernet, AE) 群組。","B":"將 ethernet1/1、ethernet1/2 與 ethernet1/3 置於同一個 Layer 2 區域 (zone)。","C":"建立一條「允許 (allow)」安全政策 (Security policy)，將來源與目的 VLAN 皆設為「VLAN 20」。","D":"為 VLAN 20 建立一個 Layer 3 子介面 (subinterface) 以啟用路由。"}},
{n:109,ans:["D"],topic:"L3-only 功能",stem:"Which feature can be enabled on a Layer 3 interface but is not available on Layer 2 interfaces?",opts:{"A":"NetFlow profile","B":"LLDP profile","C":"QoS profile","D":"DHCP client"},qZh:"哪項功能可在 Layer 3 介面上啟用，但在 Layer 2 介面上無法使用？",optsZh:{"A":"NetFlow 設定檔 (NetFlow profile)","B":"LLDP 設定檔 (LLDP profile)","C":"QoS 設定檔 (QoS profile)","D":"DHCP 用戶端 (DHCP client)"}},
{n:110,multi:true,ans:["A","D"],topic:"Tunnel IP 需求",stem:"An engineer is required to configure a site-to-site VPN that will automatically fail over to a backup link if the primary tunnel goes down. The engineer also needs to exchange routes dynamically between the sites. Which two features necessitate assigning an IP address to the tunnel interface? (Choose two.)",opts:{"A":"Tunnel monitoring","B":"Proxy ID configuration","C":"IKEv2 protocol support","D":"Dynamic routing"},qZh:"一位工程師被要求設定一條站對站 (site-to-site) VPN，使其在主要隧道中斷時自動切換 (fail over) 至備援連結。該工程師也需要在站點之間動態交換路由。哪兩項功能需要為隧道介面 (tunnel interface) 指派 IP 位址？（選兩項）",optsZh:{"A":"隧道監控 (Tunnel monitoring)","B":"Proxy ID 設定","C":"IKEv2 協定支援","D":"動態路由 (Dynamic routing)"}},
{n:111,multi:true,ans:["C","D"],topic:"Kerberos+LDAP Fallback",stem:"An organization is migrating its GlobalProtect user authentication from an existing LDAP directory to a new Kerberos server. To ensure a smooth transition, the network security team needs to allow users from both directories to authenticate for a period of 90 days. The firewall should first attempt authentication against the new Kerberos server and then fall back to the legacy LDAP server if the initial attempt fails. Which two configurations are required to implement this authentication fallback strategy? (Choose two.)",opts:{"A":"Configure a new RADIUS proxy on the firewall to handle authentication requests for both Kerberos and LDAP.","B":"Implement a User-ID Group Mapping policy to link users between the LDAP and Kerberos directories.","C":"Configure an authentication sequence that lists the Kerberos authentication profile first, followed by the LDAP authentication profile.","D":"Configure a new authentication profile that references the Kerberos server profile."},qZh:"某組織正將其 GlobalProtect 使用者認證從現有的 LDAP 目錄遷移至新的 Kerberos 伺服器。為確保平順過渡，網路安全團隊需要在 90 天期間允許來自兩種目錄的使用者進行認證。防火牆應先嘗試對新的 Kerberos 伺服器進行認證，若初次嘗試失敗則回退 (fall back) 至舊有的 LDAP 伺服器。實作此認證回退策略需要哪兩項設定？（選兩項）",optsZh:{"A":"在防火牆上設定一個新的 RADIUS 代理 (proxy)，以同時處理 Kerberos 與 LDAP 的認證請求。","B":"實作一個 User-ID 群組對應 (Group Mapping) 政策，以連結 LDAP 與 Kerberos 目錄之間的使用者。","C":"設定一個認證序列 (authentication sequence)，先列出 Kerberos 認證設定檔，接著列出 LDAP 認證設定檔。","D":"設定一個參照 Kerberos 伺服器設定檔 (server profile) 的新認證設定檔 (authentication profile)。"}},
{n:112,ans:["A"],topic:"Service Route 改 in-band",stem:"A network administrator is hardening a new Palo Alto Networks firewall and wants to ensure that all firewall-generated management traffic, such as calls to Strata Logging Service, uses a dedicated in-band data port instead of the out-of-band management port. Which configuration setting should the administrator modify to reroute this type of traffic?",opts:{"A":"Service route","B":"Interface Management profile","C":"Virtual router","D":"Static route"},qZh:"一位網路管理員正在強化一台新的 Palo Alto Networks 防火牆，並希望確保所有由防火牆產生的管理流量（例如對 Strata Logging Service 的呼叫）使用專用的帶內 (in-band) 資料埠，而非帶外 (out-of-band) 管理埠。管理員應修改哪個設定以重新導向此類流量？",optsZh:{"A":"服務路由 (Service route)","B":"介面管理設定檔 (Interface Management profile)","C":"虛擬路由器 (Virtual router)","D":"靜態路由 (Static route)"}},
{n:113,ans:["C"],topic:"MSSP VSYS 限制",stem:"A Managed Security Service Provider (MSSP) is creating a new VSYS for a customer. To prevent this customer's traffic from overwhelming the firewall's state table, which resource limit should the MSSP configure for the new VSYS?",opts:{"A":"Max security profiles","B":"Max bandwidth","C":"Max sessions","D":"Max Log Forwarding profiles"},qZh:"某託管安全服務供應商 (Managed Security Service Provider, MSSP) 正在為一位客戶建立新的 VSYS。為防止此客戶的流量塞爆防火牆的狀態表 (state table)，MSSP 應為新的 VSYS 設定哪一項資源限制？",optsZh:{"A":"最大安全設定檔數量 (Max security profiles)","B":"最大頻寬 (Max bandwidth)","C":"最大工作階段數 (Max sessions)","D":"最大 Log Forwarding 設定檔數量 (Max Log Forwarding profiles)"}},
{n:114,multi:true,ans:["A","B"],topic:"SSL/TLS Profile 服務",stem:"Which two Palo Alto Networks firewall services are secured by attaching an SSL/TLS service profile to their configuration? (Choose two.)",opts:{"A":"Authentication portal","B":"GlobalProtect portal","C":"LDAP server profiles","D":"Prisma Access service connections"},qZh:"下列哪兩項 Palo Alto Networks 防火牆服務是透過在其設定中附加 SSL/TLS service profile 來加以保護？（請選擇兩項。）",optsZh:{"A":"驗證入口網站 (Authentication portal)","B":"GlobalProtect portal","C":"LDAP server profiles","D":"Prisma Access 服務連線 (service connections)"}},
{n:115,multi:true,ans:["A","B"],topic:"後量子 IKEv2",stem:"To comply with new directives mandating the use of quantum-resistant cryptography for all data-in-transit, a network engineer is tasked with reconfiguring existing IKEv2 VPN tunnels between PA-Series firewalls to meet this requirement. Which two actions should the engineer take to ensure compliance? (Choose two.)",opts:{"A":"Configure an IKE Crypto profile with one or more post-quantum rounds selected and apply it to an IKE Gateway configured for the post-quantum key exchange mechanism.","B":"Establish a shared secret of at least 64 characters and configure it as a post-quantum pre-shared key (PPK) within an IKEv2-only IKE Gateway.","C":"Generate a post-quantum pre-shared key (PPK) and apply it within the IPSec tunnel configuration's advanced settings.","D":"Enable GlobalProtect with quantum-resistant tunneling and apply the profile to the IKE Gateway."},qZh:"為符合要求所有傳輸中資料 (data-in-transit) 都必須使用抗量子加密 (quantum-resistant cryptography) 的新指令，一位網路工程師受命重新設定 PA-Series 防火牆之間既有的 IKEv2 VPN 通道以滿足此需求。為確保合規，該工程師應採取哪兩項動作？（請選擇兩項。）",optsZh:{"A":"設定一個 IKE Crypto profile，並選取一個或多個後量子回合 (post-quantum rounds)，再將其套用至已設定後量子金鑰交換機制 (post-quantum key exchange mechanism) 的 IKE Gateway。","B":"建立一組至少 64 個字元的共用密鑰 (shared secret)，並在僅使用 IKEv2 的 IKE Gateway 中將其設定為後量子預共用金鑰 (post-quantum pre-shared key, PPK)。","C":"產生一組後量子預共用金鑰 (post-quantum pre-shared key, PPK)，並將其套用於 IPSec 通道設定的進階設定中。","D":"啟用具備抗量子隧道 (quantum-resistant tunneling) 的 GlobalProtect，並將該設定檔套用至 IKE Gateway。"}},
{n:116,multi:true,ans:["C","D"],topic:"AWS+vWAN Cloud NGFW",stem:"An organization is securing its cloud workloads using the Palo Alto Networks platform. The goal is to use a fully managed firewall service that integrates with Panorama for consistent policy management. The solution must be scalable and require minimal changes to the existing routing fabric.\n- The AWS cloud uses a distributed architecture where each application virtual private cloud (VPC) routes internet traffic through its own internet gateway.\n- The Azure cloud is built around a Virtual WAN (vWAN) hub for centralized connectivity.\n\nWhich two deployments meet these criteria? (Choose two.)",opts:{"A":"Native cloud provider firewalls in both cloud environments and connected to Panorama for management","B":"Cloud NGFW in each spoke VNet with User-Defined Routes (UDRs) to redirect traffic bypassing the vWAN hub","C":"Cloud NGFW endpoints in each application VPC, updating the VPC route tables to direct traffic through the endpoints","D":"Cloud NGFW as a security partner in the vWAN hub with routing configured to send traffic through the NGFW"},qZh:"某組織正使用 Palo Alto Networks 平台保護其雲端工作負載。目標是採用一項與 Panorama 整合以達成一致策略管理 (policy management) 的全託管防火牆服務。該解決方案必須可擴展，且對既有路由架構 (routing fabric) 的變動需求最小。\n- AWS 雲端採用分散式架構，每個應用程式的虛擬私有雲 (virtual private cloud, VPC) 各自透過自己的網際網路閘道 (internet gateway) 路由網際網路流量。\n- Azure 雲端則圍繞 Virtual WAN (vWAN) hub 建構，以集中化連線。\n\n下列哪兩種部署方式符合這些條件？（請選擇兩項。）",optsZh:{"A":"在兩個雲端環境中皆使用雲端供應商原生防火牆 (native cloud provider firewalls)，並連接至 Panorama 進行管理","B":"在每個 spoke VNet 中部署 Cloud NGFW，並使用使用者自訂路由 (User-Defined Routes, UDRs) 將流量重新導向，繞過 vWAN hub","C":"在每個應用程式 VPC 中部署 Cloud NGFW endpoints，並更新 VPC 路由表 (route tables) 將流量導向這些 endpoints","D":"將 Cloud NGFW 作為 vWAN hub 中的安全合作夥伴 (security partner)，並設定路由以將流量送經 NGFW"}},
{n:117,ans:["A"],topic:"CIE 多 Okta",stem:"A holding company has recently acquired two new businesses, each with its own Okta identity provider. The holding company wants to use a single Cloud Identity Engine (CIE) instance to provide User-ID for all three organizations' firewalls. However, for legal reasons, the firewalls of Company A must only receive identity data from Company A's Okta instance, and the firewalls of Company B must only receive data from Company B's Okta instance. Which configuration in CIE supports this requirement with highest operational efficiency?",opts:{"A":"Configure a CIE tenant, connect Okta, and create segments.","B":"Configure the firewalls for each company to query their respective Okta IdPs directly, bypassing CIE for redistribution.","C":"Push all identity data to Panorama and use Panorama's group mapping include/exclude lists to control what each firewall learns.","D":"Create a master CIE tenant for the holding company and peer it with two subordinate tenants, one for each acquired business."},qZh:"某控股公司近期收購了兩家新企業，每家各有自己的 Okta 身分識別提供者 (identity provider)。該控股公司希望使用單一 Cloud Identity Engine (CIE) 執行個體，為全部三個組織的防火牆提供 User-ID。然而，基於法律因素，A 公司的防火牆只能接收來自 A 公司 Okta 執行個體的身分資料，而 B 公司的防火牆只能接收來自 B 公司 Okta 執行個體的資料。CIE 中的哪項設定能以最高的營運效率支援此需求？",optsZh:{"A":"設定一個 CIE tenant，連接 Okta，並建立 segments。","B":"將每家公司的防火牆設定為直接查詢其各自的 Okta IdPs，繞過 CIE 進行重新分發 (redistribution)。","C":"將所有身分資料推送至 Panorama，並使用 Panorama 的群組對應 (group mapping) 包含／排除清單來控制每台防火牆所學習到的內容。","D":"為控股公司建立一個主 CIE tenant，並將其與兩個從屬 tenant 對等連接 (peer)，每個收購企業各一個。"}},
{n:118,ans:["A"],topic:"Intermediate CA 缺失",stem:"A network engineer has configured a PAN-OS firewall for client certificate authentication. The firewall has the corporate root CA certificate loaded. Client certificates are issued by an intermediate certificate authority (CA), which is signed by the root CA. However, when users attempt to connect, the authentication fails, and system logs indicate an \"invalid certificate\" error. What is the most likely cause of this authentication failure?",opts:{"A":"Intermediate CA certificate has not been imported onto the firewall and added to the trust chain.","B":"Client certificates were generated with an insecure key length (e.g., 1024-bit RSA).","C":"Firewall clock is out of sync with the CA server by more than five minutes.","D":"Online Certificate Status Protocol (OCSP) responder is unreachable, and no certificate revocation list (CRL) fallback is configured."},qZh:"一位網路工程師已為某 PAN-OS 防火牆設定用戶端憑證驗證 (client certificate authentication)。該防火牆已載入企業的根 CA 憑證 (root CA certificate)。用戶端憑證是由中繼憑證授權單位 (intermediate certificate authority, CA) 簽發，而該中繼 CA 由根 CA 簽署。然而，當使用者嘗試連線時，驗證失敗，且系統日誌顯示「無效憑證 (invalid certificate)」錯誤。此次驗證失敗最可能的原因為何？",optsZh:{"A":"中繼 CA 憑證 (Intermediate CA certificate) 尚未匯入防火牆並加入信任鏈 (trust chain)。","B":"用戶端憑證是以不安全的金鑰長度（例如 1024 位元 RSA）所產生。","C":"防火牆時鐘與 CA 伺服器的時間不同步，相差超過五分鐘。","D":"線上憑證狀態協定 (Online Certificate Status Protocol, OCSP) 回應器無法連線，且未設定憑證撤銷清單 (certificate revocation list, CRL) 作為備援。"}},
{n:119,ans:["A"],topic:"Duplicate Logging",stem:"An administrator is configuring firewalls via a Panorama template to forward logs to a newly provisioned Strata Logging Service instance. The operational requirement is to maintain existing logging to on-premises Panorama log collectors for immediate, low-latency queries while also forwarding logs to Strata Logging Service for long-term archival. The administrator has already configured and enabled cloud logging connectivity. Which additional step is necessary to meet the operational requirement?",opts:{"A":"Enable duplicate logging (cloud and on-premises) under Device → Setup → Management in the appropriate templates.","B":"Enable log syncing and commit the template changes to both the on-premises and cloud collectors.","C":"In the collector group settings, add the Strata Logging Service as a secondary destination for the on-premises collector.","D":"Add the Panorama log collector and Strata Logging Service IP addresses to the cloud logging service routes to ensure dual-path cloud and on-premises reachability."},qZh:"一位管理員正透過 Panorama template 設定多台防火牆，將日誌轉發至新建置的 Strata Logging Service 執行個體。營運需求是維持現有日誌轉發至內部部署 (on-premises) 的 Panorama log collectors 以供即時、低延遲查詢，同時也將日誌轉發至 Strata Logging Service 進行長期封存。管理員已設定並啟用雲端日誌連線。為滿足此營運需求，還需要哪一個額外步驟？",optsZh:{"A":"在適當的 templates 中，於 Device → Setup → Management 下啟用重複日誌記錄 (duplicate logging)（雲端與內部部署）。","B":"啟用日誌同步 (log syncing)，並將 template 變更提交 (commit) 至內部部署與雲端的 collectors。","C":"在 collector group 設定中，將 Strata Logging Service 新增為內部部署 collector 的次要目的地 (secondary destination)。","D":"將 Panorama log collector 與 Strata Logging Service 的 IP 位址新增至雲端日誌的 service routes，以確保雲端與內部部署的雙路徑可達性。"}},
{n:120,ans:["B"],topic:"Panorama 直接執行",stem:"An administrator needs to perform several maintenance tasks on a managed firewall directly from the Panorama console without using the Context Switch feature. Which set of tasks can the administrator fully execute from the Panorama UI?",opts:{"A":"Edit a post-rule. Create a new certificate profile. Configure the firewall's hostname.","B":"Download and install a new content update. View current firewall session details. Initiate a device reboot.","C":"Create a new zone. Configure a new virtual router. View the local ACC on the firewall.","D":"Modify the IP address of a Layer 3 interface. Configure a new local administrator account. Edit a pre-rule."},qZh:"一位管理員需要直接從 Panorama 主控台對某台受管防火牆執行數項維護工作，且不使用 Context Switch 功能。管理員可從 Panorama UI 完整執行哪一組工作？",optsZh:{"A":"編輯 post-rule。建立新的 certificate profile。設定防火牆的主機名稱 (hostname)。","B":"下載並安裝新的內容更新 (content update)。檢視目前的防火牆工作階段詳情 (session details)。啟動裝置重新開機。","C":"建立新的 zone。設定新的 virtual router。檢視防火牆上的本機 ACC。","D":"修改 Layer 3 介面的 IP 位址。設定新的本機管理員帳號。編輯 pre-rule。"}},

const MAIN_KEY='ngfw_quiz_state_v2';
const MASTERED_KEY='ngfw_mastered_v1';
const WRONG_STATE_KEY='ngfw_wrong_state_v1';
let wrongState=JSON.parse(localStorage.getItem(WRONG_STATE_KEY)||'{}');
let mastered=new Set(JSON.parse(localStorage.getItem(MASTERED_KEY)||'[]'));
let displayList=[];

function save(){ localStorage.setItem(WRONG_STATE_KEY, JSON.stringify(wrongState)); }
function saveMastered(){ localStorage.setItem(MASTERED_KEY, JSON.stringify([...mastered])); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 找出錯題：主站答錯 + 錯題站答錯，扣掉已掌握
function getWrongQns(){
  const main=JSON.parse(localStorage.getItem(MAIN_KEY)||'{}');
  const set=new Set();
  for(const qn in main){ if(main[qn]&&main[qn].submitted&&main[qn].correct===false) set.add(+qn); }
  for(const qn in wrongState){ if(wrongState[qn]&&wrongState[qn].submitted&&wrongState[qn].correct===false) set.add(+qn); }
  return [...set].filter(qn=>!mastered.has(qn));
}

function render(){
  const wrongQns=getWrongQns();
  const container=document.getElementById('quiz');
  container.innerHTML='';

  if(wrongQns.length===0){
    container.innerHTML='<div class="empty"><h2>🎉 目前沒有待練錯題！</h2><p>先到 <a href="./">主測驗站</a> 練習，答錯的題目會自動出現在這裡。<br>或你已經把錯題都練到掌握了，太棒了！💪</p></div>';
    updateStats();
    return;
  }

  displayList = wrongQns.map(qn=>QUESTIONS.find(q=>q.n===qn)).filter(Boolean);
  displayList.forEach((q,idx)=>{
    const st=wrongState[q.n]||{};
    const div=document.createElement('div');
    div.className='q'; div.id='wq'+q.n;
    const inputType=q.multi?'checkbox':'radio';
    const multiHint=q.multi?'<span class="multi-hint">複選 '+q.ans.length+' 項</span>':'';
    // 洗牌選項
    let optMap=st.optMap;
    if(!optMap){
      const keys=['A','B','C','D'].filter(k=>q.opts[k]);
      const sh=shuffle(keys); optMap={}; ['A','B','C','D'].forEach((L,i)=>{ if(sh[i]) optMap[L]=sh[i]; });
      st.optMap=optMap; wrongState[q.n]=st; save();
    }
    let optsHtml='';
    for(const dK of ['A','B','C','D']){
      const oK=optMap[dK]; if(!oK||!q.opts[oK]) continue;
      optsHtml+='<label class="opt" data-q="'+q.n+'" data-k="'+oK+'"><input type="'+inputType+'" name="wq'+q.n+'" value="'+oK+'" onchange="onSel('+q.n+')"><b>'+dK+'.</b> '+esc(q.opts[oK])+'</label>';
    }
    div.innerHTML='<div class="num">錯題 '+(idx+1)+' / '+displayList.length+'　<span style="color:#888;font-weight:400">(原題庫 Q'+q.n+' · '+esc(q.topic)+')</span> '+multiHint+'</div>'+
      '<div class="stem">'+esc(q.stem)+'</div>'+
      optsHtml+
      '<button class="submit" id="wbtn'+q.n+'" onclick="check('+q.n+')">送出答案</button>'+
      '<div class="feedback" id="wfb'+q.n+'" style="display:none"></div>';
    container.appendChild(div);
    if(st.submitted) showResult(q.n);
  });
  updateStats();
}

function onSel(n){
  const sel=getSel(n);
  document.querySelectorAll('.opt[data-q="'+n+'"]').forEach(el=>el.classList.toggle('selected',sel.includes(el.dataset.k)));
}
function getSel(n){ return Array.from(document.querySelectorAll('input[name="wq'+n+'"]:checked')).map(i=>i.value); }
function arrEq(a,b){ return a.length===b.length&&a.every((v,i)=>v===b[i]); }
function o2d(n,oK){ const m=wrongState[n].optMap; for(const d in m) if(m[d]===oK) return d; return oK; }

function check(n){
  const q=QUESTIONS.find(x=>x.n===n);
  const sel=getSel(n);
  if(sel.length===0){ alert('請先選擇答案'); return; }
  if(q.multi&&sel.length!==q.ans.length){ if(!confirm('此題需選 '+q.ans.length+' 項，仍要提交？')) return; }
  const correct=arrEq([...sel].sort(),[...q.ans].sort());
  wrongState[n]=Object.assign(wrongState[n]||{},{sel,submitted:true,correct});
  save();
  showResult(n);
  updateStats();
}

function showResult(n){
  const q=QUESTIONS.find(x=>x.n===n);
  const st=wrongState[n]; if(!st||!st.submitted) return;
  document.querySelectorAll('.opt[data-q="'+n+'"]').forEach(el=>{
    el.classList.remove('selected','correct','wrong','reveal-correct');
    const picked=st.sel.includes(el.dataset.k), isC=q.ans.includes(el.dataset.k);
    if(picked&&isC) el.classList.add('correct');
    else if(picked&&!isC) el.classList.add('wrong');
    else if(!picked&&isC) el.classList.add('reveal-correct');
    el.querySelector('input').disabled=true;
  });
  const fb=document.getElementById('wfb'+n); fb.style.display='block';
  const dAns=q.ans.map(k=>o2d(n,k)).sort();
  const dSel=st.sel.map(k=>o2d(n,k)).sort();
  const btn=document.getElementById('wbtn'+n); if(btn) btn.style.display='none';
  if(st.correct){
    fb.className='feedback ok';
    fb.innerHTML='✅ 答對了！正確答案：<b>'+dAns.join(', ')+'</b>　<button class="master-btn" onclick="masterIt('+n+')">✔ 已掌握，移出錯題本</button>';
  }else{
    fb.className='feedback ng';
    fb.innerHTML='❌ 又答錯了。你選：<b>'+(dSel.join(', ')||'(未作答)')+'</b>　正確：<b>'+dAns.join(', ')+'</b>　（留在錯題本繼續練）<br><button class="submit" style="margin-top:8px" onclick="retry('+n+')">🔁 再試一次</button>';
  }
}

function retry(n){
  // 重置這題（重新洗牌）
  delete wrongState[n];
  save();
  render();
  const el=document.getElementById('wq'+n); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}

function masterIt(n){
  mastered.add(n); saveMastered();
  render();
}

function updateStats(){
  const wrongQns=getWrongQns();
  document.getElementById('wrongCnt').textContent=wrongQns.length;
  const ok=Object.values(wrongState).filter(s=>s.submitted&&s.correct).length;
  document.getElementById('okCnt').textContent=ok;
  document.getElementById('masteredCnt').textContent=mastered.size;
}

function syncWrong(){ render(); alert('已重新同步主站錯題'); }
function resetMastered(){
  if(!confirm('確定要把「已掌握」的題目全部放回錯題本重練？')) return;
  mastered=new Set(); saveMastered(); render();
}
function restartAll(){
  const n=getWrongQns().length;
  if(n===0){ alert('目前沒有錯題可重練'); return; }
  if(!confirm('確定要把錯題本裡這 '+n+' 題的作答紀錄全部清除、重新洗牌，從頭再練一遍？\n（已掌握移出的不受影響）')) return;
  wrongState={}; save(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
